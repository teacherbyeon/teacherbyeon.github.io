<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <link rel="stylesheet" href="style.css">
  <title>Algebra Tiles MVP</title>

  <!-- (선택) style.css를 쓰지 않고 여기서 스타일을 유지하고 싶으면 이 <style>을 남겨도 됩니다 -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
    .sidebar { border-right: 1px solid #ddd; padding: 12px; }
    .btn { width: 100%; padding: 10px 12px; margin: 6px 0; cursor: pointer; }
    .workspace-wrap { display: grid; grid-template-rows: auto 1fr; }
    .topbar { padding: 10px 12px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; }
    .expr { font-size: 16px; }
    .workspace {
      position: relative;
      background:
        linear-gradient(to right, rgba(0,0,0,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,.06) 1px, transparent 1px);
      background-size: 80px 80px; /* grid size */
      overflow: hidden;
    }
    .tile {
      position: absolute;
      border: 2px solid rgba(0,0,0,.35);
      border-radius: 2px;
      box-sizing: border-box;
      user-select: none;
      display:flex; align-items:center; justify-content:center;
      font-weight: 700;
      color: rgba(0,0,0,.65);
    }
    .pos { background: rgba(80,140,255,.25); }
    .neg { background: rgba(255,90,90,.25); }
    .selected { outline: 3px solid rgba(0,0,0,.35); }
    .hint { font-size: 13px; color:#555; line-height:1.4; }
    .small { font-size: 12px; color:#666; }
  </style>
</head>

<body>
<div class="app">
  <div class="sidebar">
    <h3>대수블럭 메뉴</h3>
    <button class="btn" data-add="x2:+1">+x²</button>

    <button class="btn" data-add="x:+1">+x (세로)</button>
    <button class="btn" data-add="xH:+1">+x (가로)</button>

    <button class="btn" data-add="x:-1">-x (세로)</button>
    <button class="btn" data-add="xH:-1">-x (가로)</button>


    <button class="btn" data-add="unit:+1">+1 (unit)</button>
    <button class="btn" data-add="unit:-1">-1 (unit)</button>





    <hr/>
    <button class="btn" id="btnArrange">정리(자동 정렬)</button>
    <button class="btn" id="btnClear">전체 삭제</button>
    <button class="btn" id="btnToggleMode">모드 전환: (x,1) ↔ (a,b)</button>
    <button class="btn" id="btnUndo">되돌리기 (ctrl+z)</button>


    <p class="hint">
      - 타일 클릭: 선택<br/>
      - 드래그: 이동(마우스/터치)<br/>
      - Delete/Backspace: 삭제<br/>
    </p>
  </div>

  <div class="workspace-wrap">
    <div class="topbar">
      <div class="expr" id="expr">식: 0</div>
      <div class="small" id="count"></div>

      <input
        id="target"
        type="text"
        placeholder="인수분해한 식을 입력하세요."
        style="margin-left:auto; width:420px; max-width:45vw; padding:8px;"
      />
    </div>

    <div class="workspace" id="ws"></div>
  </div>
</div>

<!-- ✅ JS는 이것 하나만! (index.html 안에 <script>...</script>로 JS코드 넣지 말기) -->
<script src="app.js" defer></script>
</body>
</html>
