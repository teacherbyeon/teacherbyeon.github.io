%}.readout{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:7px;font-size:15px;color:var(--muted)}.readout b{color:var(--text)}.activity-note{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}.shape{transition:opacity .2s,stroke .2s,fill .2s,filter .2s}.off{opacity:0!important;pointer-events:none}.circle-line,.line{stroke:var(--text);stroke-width:3;fill:none;stroke-linecap:round}.helper{stroke:#7b8189;stroke-width:2.2;fill:none;stroke-dasharray:8 7;stroke-linecap:round}.perp{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}.pt{fill:var(--text)}.ptO{fill:var(--accent)}.txt{fill:var(--text);font-size:24px;font-weight:750}.txtSmall{fill:var(--muted);font-size:18px}.eq{fill:var(--accent);font-size:23px;font-weight:800}.right{stroke:var(--text);stroke-width:2.2;fill:none}.tick{stroke:var(--text);stroke-width:3.4;stroke-linecap:round}

<div class="app"><div class="topbar"><span class="badge" id="badge">1 / 17</span><span class="title" id="title">원의 현의 길이</span></div><div class="stage"><section class="diagram"><svg id="svg" viewBox="0 0 760 520" role="img" aria-label="원의 현의 길이에 관한 성질 설명 그림"><g id="circleLayer"></g><g id="lineLayer"></g><g id="markLayer"></g><g id="textLayer"></g></svg></section><div id="activityControls"></div><div class="subtitle" id="subtitle"></div><div class="hint" id="hint"></div><div class="footer"><button id="prev" type="button">이전</button><div class="progress"><div id="bar"></div></div><span class="small" id="stepText">1단계</span><button class="primary" id="next" type="button">다음</button></div></div></div>
<script>
(()=>{
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg"),circleLayer=document.getElementById("circleLayer"),lineLayer=document.getElementById("lineLayer"),markLayer=document.getElementById("markLayer"),textLayer=document.getElementById("textLayer"),subtitle=document.getElementById("subtitle"),hint=document.getElementById("hint"),activityControls=document.getElementById("activityControls"),badge=document.getElementById("badge"),title=document.getElementById("title"),prev=document.getElementById("prev"),next=document.getElementById("next"),bar=document.getElementById("bar"),stepText=document.getElementById("stepText");
const O={x:325,y:255},R=176;
function add(tag,attrs,parent=lineLayer){const el=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));parent.appendChild(el);return el}function line(P,Q,cls,key,id,parent=lineLayer){return add("line",{x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,class:`shape ${cls}`,"data-key":key,id},parent)}function dot(P,cls,key,id,r=6){return add("circle",{cx:P.x,cy:P.y,r,class:`shape ${cls}`,"data-key":key,id},markLayer)}function text(P,s,cls,key,id,dx=0,dy=0){const el=add("text",{x:P.x+dx,y:P.y+dy,class:`shape ${cls}`,"data-key":key,id},textLayer);el.textContent=s;return el}function unit(vx,vy){const l=Math.hypot(vx,vy)||1;return{x:vx/l,y:vy/l}}function chordFromNormal(d,phi){const n={x:Math.cos(phi),y:Math.sin(phi)},t={x:-n.y,y:n.x},M={x:O.x+d*n.x,y:O.y+d*n.y},h=Math.sqrt(Math.max(0,R*R-d*d));return{M,A:{x:M.x-h*t.x,y:M.y-h*t.y},B:{x:M.x+h*t.x,y:M.y+h*t.y},h,n,t}}function rightMarker(P,t,n,id,key){const s=15,p1={x:P.x+t.x*s,y:P.y+t.y*s},p2={x:p1.x-n.x*s,y:p1.y-n.y*s},p3={x:P.x-n.x*s,y:P.y-n.y*s};return add("polyline",{points:`${P.x},${P.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`,class:"shape right","data-key":key,id},markLayer)}function tick(P,Q,t,id,key){const x=P.x+(Q.x-P.x)*t,y=P.y+(Q.y-P.y)*t,u=unit(Q.x-P.x,Q.y-P.y),n={x:-u.y,y:u.x},L=10;return add("line",{x1:x-n.x*L,y1:y-n.y*L,x2:x+n.x*L,y2:y+n.y*L,class:"shape tick","data-key":key,id},markLayer)}
function styledTick(P,Q,t,id,key,cls){const x=P.x+(Q.x-P.x)*t,y=P.y+(Q.y-P.y)*t,u=unit(Q.x-P.x,Q.y-P.y),n={x:-u.y,y:u.x},L=10;return add("line",{x1:x-n.x*L,y1:y-n.y*L,x2:x+n.x*L,y2:y+n.y*L,class:`shape ${cls}`,"data-key":key,id},markLayer)}
function poly(points,cls,key,id){return add("polygon",{points:points.map(p=>`${p.x},${p.y}`).join(" "),class:`shape ${cls}`,"data-key":key,id},markLayer)}
add("circle",{cx:O.x,cy:O.y,r:R,class:"shape circle-line","data-key":"circle",id:"circle"},circleLayer);dot(O,"ptO","O","pointO");text(O,"O","txt","O","labelO",12,-10);
line({x:0,y:0},{x:0,y:0},"line","activityChord","actChord");line({x:0,y:0},{x:0,y:0},"guide","activityDistance","actDist");dot({x:0,y:0},"pt","activityA","actA");dot({x:0,y:0},"pt","activityB","actB");text({x:0,y:0},"A","txtSmall","activityA","actALabel",-20,12);text({x:0,y:0},"B","txtSmall","activityB","actBLabel",10,12);const actHandle=dot({x:0,y:0},"activity-handle","activityHandle","actHandle",10);
const d=86,c1=chordFromNormal(d,0.4),c2=chordFromNormal(d,2.6);line(c1.A,c1.B,"line","proofChords","ABline");line(c2.A,c2.B,"line","proofChords","CDline");dot(c1.A,"pt","proofPoints","A1");dot(c1.B,"pt","proofPoints","B1");dot(c2.A,"pt","proofPoints","C1");dot(c2.B,"pt","proofPoints","D1");dot(c1.M,"pt","proofFeet","M1");dot(c2.M,"pt","proofFeet","N1");text(c1.A,"A","txtSmall","proofPoints","A1L",-20,6);text(c1.B,"B","txtSmall","proofPoints","B1L",10,6);text(c2.A,"C","txtSmall","proofPoints","C1L",-20,6);text(c2.B,"D","txtSmall","proofPoints","D1L",10,6);text(c1.M,"M","txtSmall","proofFeet","M1L",-18,23);text(c2.M,"N","txtSmall","proofFeet","N1L",10,-10);line(O,c1.M,"perp","proofPerps","OM1");line(O,c2.M,"perp","proofPerps","ON1");line(O,c1.A,"helper","proofRadii","OA1");line(O,c2.A,"helper","proofRadii","OC1");rightMarker(c1.M,c1.t,c1.n,"rightM","rightMarks");rightMarker(c2.M,c2.t,c2.n,"rightN","rightMarks");tick(c1.A,c1.M,.62,"tickAM","halfTicks");tick(c1.M,c1.B,.38,"tickMB","halfTicks");tick(c2.A,c2.M,.62,"tickCN","halfTicks");tick(c2.M,c2.B,.38,"tickND","halfTicks");

// 8번: 합동인 두 직각삼각형을 같은 파란 윤곽으로 표시
poly([O,c1.A,c1.M],"congruentMark","triangleMarks","triOAM");

poly([O,c1.A,c1.M],"ghostPoly","triangleHits","triHitOAM");
poly([O,c2.A,c2.M],"ghostPoly","triangleHits","triHitOCN");

styledTick(c1.A,c1.M,.62,"markAM","AMCNMarks","halfEqMark");
styledTick(c2.A,c2.M,.62,"markCN","AMCNMarks","halfEqMark");

// 14번 클릭 시 AM, CN 선분 자체가 강조되도록 투명한 겹선
line(c1.A,c1.M,"ghostLine","AMCNSegments","AMseg");
line(c2.A,c2.M,"ghostLine","AMCNSegments","CNseg");

// 11번 이후: 두 현 AB, CD가 같다는 표시(같은 두 줄)
styledTick(c1.A,c1.B,.43,"chordAB1","chordEqMarks","chordEqMark");
styledTick(c1.A,c1.B,.49,"chordAB2","chordEqMarks","chordEqMark");
styledTick(c2.A,c2.B,.43,"chordCD1","chordEqMarks","chordEqMark");
styledTick(c2.A,c2.B,.49,"chordCD2","chordEqMarks","chordEqMark");
line(c1.A,c1.B,"equalChordLine","equalChordColor","ABcolor");
line(c2.A,c2.B,"equalChordLine","equalChordColor","CDcolor");text({x:610,y:185},"OM = ON","eq","eqOMON","eqOMON",-55,0);text({x:610,y:235},"OA = OC","eq","eqOAOC","eqOAOC",-55,0);text({x:610,y:285},"∠OMA = ∠ONC = 90°","eq","eqRight","eqRight",-120,0);text({x:610,y:350},"△OAM ≡ △OCN","eq","eqCong","eqCong",-95,0);text({x:610,y:405},"AM = CN","eq","eqHalf","eqHalf",-55,0);text({x:610,y:455},"AB = CD","eq","eqChord","eqChord",-55,0);
const finalC=chordFromNormal(92,Math.PI/2);line(finalC.A,finalC.B,"line","finalChord","finalAB");line(O,finalC.M,"perp","finalOM","finalOM");dot(finalC.A,"pt","finalPts","finalA");dot(finalC.B,"pt","finalPts","finalB");dot(finalC.M,"pt","finalM","finalM");text(finalC.A,"A","txtSmall","finalPts","finalAL",-18,16);text(finalC.B,"B","txtSmall","finalPts","finalBL",10,16);text(finalC.M,"M","txtSmall","finalM","finalML",10,20);rightMarker(finalC.M,finalC.t,finalC.n,"finalRight","finalRight");tick(finalC.A,finalC.M,.62,"finalTick1","finalTicks");tick(finalC.M,finalC.B,.38,"finalTick2","finalTicks");
const steps=[
{title:"원의 현의 길이",show:["circle","O"],text:"원에서 중심으로부터 같은 거리에 있는 두 현의 길이는 어떨까요?"},
{title:"활동 1. 현을 움직여 보기",show:["circle","O","activityChord","activityDistance","activityA","activityB","activityHandle"],text:"현 AB를 중심에 가까이, 멀리 움직여 보세요. 중심에서 현까지의 거리와 현의 길이는 어떻게 변하나요?",activity:"distance"},
{title:"관찰한 내용",show:["circle","O","activityChord","activityDistance","activityA","activityB"],text:"중심에 가까운 현은 길어지고, 중심에서 멀어진 현은 짧아지는 것을 확인할 수 있습니다.",activity:"distance-static"},
{title:"활동 2. 같은 거리를 유지하기",show:["circle","O","activityChord","activityDistance","activityA","activityB"],text:"이번에는 중심에서 현까지의 거리를 그대로 유지한 채 현의 방향만 바꾸어 보세요. 현의 길이는 어떻게 되나요?",activity:"rotate"},
{title:"성질을 예상해 보기",show:["circle","O","activityChord","activityDistance","activityA","activityB"],text:"현의 위치와 방향이 달라져도 중심으로부터의 거리가 같으면 현의 길이는 같습니다. 이제 왜 그런지 증명해 봅시다.",activity:"rotate-static"},
{title:"두 현과 중심 사이의 거리",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","rightMarks","eqOMON"],text:"중심 O에서 두 현 AB, CD에 내린 수선의 발을 각각 M, N이라 하겠습니다. 중심에서 두 현까지의 거리가 같으므로 OM = ON입니다."},
{title:"두 직각삼각형 비교",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","proofRadii","rightMarks"],text:'△OAM과 △OCN에서 <span class="click-math" data-action="radii">OA = OC</span>이고, <span class="click-math" data-action="distance">OM = ON</span>이며, <span class="click-math" data-action="right">∠OMA = ∠ONC = 90°</span>입니다.',clickable:true},
{title:"합동의 결론",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","proofRadii","rightMarks","triangleMarks","eqCong"],text:"따라서 두 직각삼각형은 빗변과 다른 한 변의 길이가 각각 같으므로 △OAM ≡ △OCN입니다."},
{title:"대응하는 변의 길이",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","AMCNMarks","eqHalf"],text:"두 삼각형이 합동이므로 대응하는 변의 길이가 같습니다. 따라서 AM = CN입니다."},
{title:"현의 절반과 전체 길이",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","rightMarks","halfTicks"],text:'원의 중심에서 현에 내린 수선은 현을 수직이등분하므로 <span class="click-math" data-action="halfAB">AB = 2AM</span>, <span class="click-math" data-action="halfCD">CD = 2CN</span>입니다.',clickable:true},
{title:"첫 번째 성질",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","chordEqMarks","eqChord"],text:"AM = CN이고 AB = 2AM, CD = 2CN이므로 AB = CD입니다. 따라서 원의 중심으로부터 같은 거리에 있는 두 현의 길이는 같습니다."},
{title:"반대도 성립할까요?",show:["circle","O","proofChords","proofPoints","equalChordColor"],text:"이번에는 길이가 같은 두 현 AB, CD가 있다고 해 봅시다. 두 현은 원의 중심으로부터 같은 거리에 있을까요?"},
{title:"길이가 같은 두 현",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","rightMarks","halfTicks","equalChordColor","AMCNSegments","AMCNMarks"],text:'AB = CD이고, 중심에서 현에 내린 수선은 현을 수직이등분하므로 <span class="click-math" data-action="halves">AM = CN</span>입니다.',clickable:true},
{title:"다시 두 직각삼각형 비교",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","proofRadii","rightMarks","AMCNSegments","AMCNMarks"],text:'△OAM과 △OCN에서 <span class="click-math" data-action="radii">OA = OC</span>, <span class="click-math" data-action="halves">AM = CN</span>, <span class="click-math" data-action="right">∠OMA = ∠ONC = 90°</span>입니다.',clickable:true},
{title:"두 번째 성질",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps","triangleHits"],text:'따라서 <span class="click-math" data-action="congruent">△OAM ≡ △OCN</span>이고, 대응하는 변의 길이가 같으므로 <span class="click-math" data-action="omon">OM = ON</span>입니다. 즉, 길이가 같은 두 현은 원의 중심으로부터 같은 거리에 있습니다.',clickable:true},
{title:"정리 1",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps"],text:'<span class="click-math" data-action="property1">원의 중심으로부터 같은 거리에 있는 두 현</span>의 길이는 같습니다.',clickable:true},
{title:"현의 길이에 관한 성질",show:["circle","O","proofChords","proofPoints","proofFeet","proofPerps"],text:'① <span class="click-math" data-action="final1">원의 중심으로부터 같은 거리에 있는 두 현</span>의 길이는 같다.<br>② <span class="click-math" data-action="final2">한 원에서 길이가 같은 두 현</span>은 원의 중심으로부터 같은 거리에 있다.',clickable:true}
];
let idx=0,activityD=92,activityPhi=Math.PI/2,dragging=false;const checkedByStep=new Map(),all=[...document.querySelectorAll("[data-key]")];
function clearFocus(){document.querySelectorAll(".focusLine,.focusDot,.focusText,.focusRight").forEach(el=>el.classList.remove("focusLine","focusDot","focusText","focusRight"))}function focus(ids){clearFocus();ids.forEach(id=>{const el=document.getElementById(id);if(!el)return;if(el.tagName==="circle")el.classList.add("focusDot");else if(el.tagName==="text")el.classList.add("focusText");else if(el.classList.contains("right"))el.classList.add("focusRight");else el.classList.add("focusLine")});setTimeout(clearFocus,2200)}
function updateActivity(d=activityD,phi=activityPhi){activityD=Math.max(0,Math.min(R-8,d));activityPhi=phi;const c=chordFromNormal(activityD,activityPhi),ch=document.getElementById("actChord");ch.setAttribute("x1",c.A.x);ch.setAttribute("y1",c.A.y);ch.setAttribute("x2",c.B.x);ch.setAttribute("y2",c.B.y);const dist=document.getElementById("actDist");dist.setAttribute("x1",O.x);dist.setAttribute("y1",O.y);dist.setAttribute("x2",c.M.x);dist.setAttribute("y2",c.M.y);[["actA",c.A],["actB",c.B]].forEach(([id,P])=>{const e=document.getElementById(id);e.setAttribute("cx",P.x);e.setAttribute("cy",P.y)});const la=document.getElementById("actALabel"),lb=document.getElementById("actBLabel");la.setAttribute("x",c.A.x-20);la.setAttribute("y",c.A.y+12);lb.setAttribute("x",c.B.x+10);lb.setAttribute("y",c.B.y+12);const h=document.getElementById("actHandle");h.setAttribute("cx",c.M.x);h.setAttribute("cy",c.M.y);const dOut=document.getElementById("distanceOut"),lOut=document.getElementById("lengthOut");if(dOut)dOut.textContent=Math.round(activityD);if(lOut)lOut.textContent=Math.round(c.h*2)}
function renderControls(activity){activityControls.innerHTML="";if(!activity)return;if(activity.startsWith("distance")){activityPhi=Math.PI/2;const box=document.createElement("div");box.className="controls";const stat=activity.endsWith("static");box.innerHTML=`<label for="distanceRange">중심 O에서 현 AB까지의 거리</label><input id="distanceRange" type="range" min="0" max="${R-8}" value="${Math.round(activityD)}" ${stat?"disabled":""}><div class="readout"><span>중심에서 현까지: <b id="distanceOut"></b></span><span>현의 길이: <b id="lengthOut"></b></span></div><div class="activity-note">${stat?"앞에서 움직여 본 결과를 떠올려 보세요.":"슬라이더를 움직이거나 그림의 파란 점을 위아래로 끌어도 됩니다."}</div>`;activityControls.appendChild(box);const range=document.getElementById("distanceRange");if(!stat)range.addEventListener("input",()=>updateActivity(Number(range.value),Math.PI/2));updateActivity(activityD,Math.PI/2)}else if(activity.startsWith("rotate")){const box=document.createElement("div"),stat=activity.endsWith("static"),deg=Math.round(activityPhi*180/Math.PI);box.className="controls";box.innerHTML=`<label for="angleRange">현 AB의 방향</label><input id="angleRange" type="range" min="0" max="180" value="${deg}" ${stat?"disabled":""}><div class="readout"><span>중심에서 현까지: <b id="distanceOut"></b></span><span>현의 길이: <b id="lengthOut"></b></span></div><div class="activity-note">${stat?"방향이 달라도 중심에서의 거리가 같으면 현의 길이는 그대로입니다.":"슬라이더를 움직여 현의 방향을 바꾸어 보세요."}</div>`;activityControls.appendChild(box);const range=document.getElementById("angleRange");if(!stat)range.addEventListener("input",()=>updateActivity(activityD,Number(range.value)*Math.PI/180));updateActivity(activityD,activityPhi)}}
function actionTargets(action){return({radii:["OA1","OC1"],distance:["OM1","ON1"],right:["rightM","rightN"],halfAB:["ABline","OM1","tickAM","tickMB"],halfCD:["CDline","ON1","tickCN","tickND"],halves:["AMseg","CNseg","markAM","markCN"],congruent:["triHitOAM","triHitOCN"],omon:["OM1","ON1"],property1:["OM1","ON1","ABline","CDline"],final1:["OM1","ON1","ABline","CDline"],final2:["ABcolor","CDcolor","OM1","ON1"]})[action]||[]}
function bindClickable(){const checked=checkedByStep.get(idx)||new Set();document.querySelectorAll(".click-math").forEach(el=>{const action=el.dataset.action;if(checked.has(action)){el.classList.add("checked");const c=document.createElement("span");c.className="checkmark";c.textContent="✓";el.appendChild(c)}el.addEventListener("click",()=>{focus(actionTargets(action));checked.add(action);checkedByStep.set(idx,checked);el.classList.add("checked");if(!el.querySelector(".checkmark")){const c=document.createElement("span");c.className="checkmark";c.textContent="✓";el.appendChild(c)}})})}
function render(){clearFocus();const s=steps[idx];all.forEach(el=>el.classList.toggle("off",!s.show.includes(el.getAttribute("data-key"))));badge.textContent=`${idx+1} / ${steps.length}`;title.textContent=s.title;subtitle.innerHTML=s.text;hint.textContent=s.clickable?"밑줄 친 글자를 눌러 그림에서 확인하세요.":"";prev.disabled=idx===0;next.disabled=idx===steps.length-1;bar.style.width=`${(idx+1)/steps.length*100}%`;stepText.textContent=`${idx+1}단계`;renderControls(s.activity);bindClickable();if(idx===5){["OM1","ON1"].forEach(id=>document.getElementById(id).classList.add("draw"));setTimeout(()=>["OM1","ON1"].forEach(id=>document.getElementById(id).classList.remove("draw")),1200)}}
actHandle.addEventListener("pointerdown",e=>{if(steps[idx].activity!=="distance")return;dragging=true;actHandle.setPointerCapture(e.pointerId)});actHandle.addEventListener("pointermove",e=>{if(!dragging||steps[idx].activity!=="distance")return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse()),d=Math.max(0,Math.min(R-8,p.y-O.y)),range=document.getElementById("distanceRange");if(range)range.value=Math.round(d);updateActivity(d,Math.PI/2)});actHandle.addEventListener("pointerup",()=>dragging=false);actHandle.addEventListener("pointercancel",()=>dragging=false);prev.addEventListener("click",()=>{if(idx>0){idx--;render()}});next.addEventListener("click",()=>{if(idx<steps.length-1){idx++;render()}});document.addEventListener("keydown",e=>{const tag=document.activeElement?.tagName;if(["INPUT","TEXTAREA","SELECT"].includes(tag))return;if(e.key==="ArrowRight"&&idx<steps.length-1){idx++;render()}if(e.key==="ArrowLeft"&&idx>0){idx--;render()}});render();
})();
</script>
