<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삼각형의 내심 강의 웹앱 v14</title>
<style>
:root{
  --panel:#ffffff;--card:#f7f7f8;--chip:#ededf0;--text:#171717;--muted:#6b7280;
  --border:#d7d8dd;--accent:#2563eb;--accentText:#ffffff;--accentBg:#eaf1ff;
  --accent2:#7c3aed;--focus:#ff7a00;--focusSoft:#ffd28a;
}
@media (prefers-color-scheme: dark){
  :root{
    --panel:#17171a;--card:#222226;--chip:#2c2c31;--text:#f4f4f5;--muted:#a1a1aa;
    --border:#404047;--accent:#60a5fa;--accentText:#07111f;--accentBg:#172554;
    --accent2:#c4b5fd;--focus:#ff9f43;--focusSoft:#ffe0b3;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:1220px;margin:0 auto;padding:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--border)}
.badge{padding:6px 10px;border-radius:999px;background:var(--accentBg);font-size:14px}
.spacer{flex:1}
button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:11px 15px;font-size:16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.back{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;text-decoration:none}
button:disabled{opacity:.4;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr;gap:10px;padding-top:16px;align-items:start}
.diagram{min-height:570px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px}
svg{width:100%;height:auto;max-height:70vh;overflow:visible}
.script{border:0;background:transparent;padding:10px 18px 4px;max-width:1080px;width:100%;margin:0 auto;text-align:center}

.script p{margin:0;white-space:pre-line;line-height:1.65;font-size:26px;font-weight:600}

.footer{display:flex;align-items:center;gap:10px;justify-content:center;padding-top:14px}
.progress{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;flex:1;max-width:430px}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
.small{font-size:14px;color:var(--muted)}




@media(max-width:820px){
  .diagram{min-height:48vh}
  .script{padding-left:8px;padding-right:8px}
  .script p{font-size:22px}
}

/* SVG */
.shape{transition:opacity .22s ease, filter .22s ease, stroke .22s ease, fill .22s ease}
.off{opacity:0 !important;pointer-events:none}
#svg .dimmed{opacity:1 !important}
.mainline{stroke:var(--text);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.helper{stroke:var(--muted);stroke-width:2.4;fill:none;stroke-dasharray:8 7;stroke-linecap:round}
.bisector{stroke:var(--accent);stroke-width:4.5;fill:none;stroke-linecap:round}
.bisectorC{stroke:var(--accent2);stroke-width:4.5;fill:none;stroke-linecap:round}
.connect{stroke:var(--accent2);stroke-width:4.5;fill:none;stroke-linecap:round}
.incircle{stroke:var(--accent);stroke-width:4.5;fill:none}
.pt{fill:var(--text)}
.ptI{fill:var(--accent)}
.txt{fill:var(--text);font-size:24px;font-weight:700}
.txtSmall{fill:var(--muted);font-size:18px}
.eq{fill:var(--accent);font-size:23px;font-weight:750}
.right{fill:none;stroke:var(--muted);stroke-width:2}
/* animation */
.draw-now{
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  animation:drawLine 1.1s ease forwards;
}
@keyframes drawLine{to{stroke-dashoffset:0}}
.blink-now{animation:blink 1.0s ease-in-out 3}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.pop-now{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.glow-now{animation:glow .9s ease-in-out 3}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 10px var(--accent))}}

/* strong focus */
.focus-stroke{
  stroke:var(--focus) !important;
  stroke-width:8px !important;
  stroke-dasharray:none !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 8px var(--focusSoft)) drop-shadow(0 0 14px var(--focus));
}
.focus-text{
  fill:var(--focus) !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 6px var(--focusSoft));
}
.focus-dot{
  fill:var(--focus) !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 8px var(--focusSoft)) drop-shadow(0 0 12px var(--focus));
}
.pulse-focus{animation:pulseFocus .9s ease-in-out infinite}
@keyframes pulseFocus{
  0%,100%{opacity:1;filter:drop-shadow(0 0 5px var(--focusSoft))}
  50%{opacity:1;filter:drop-shadow(0 0 10px var(--focusSoft)) drop-shadow(0 0 16px var(--focus))}
}

text.focus-text{font-weight:900}

/* 12단계 문장별 단독 강조 */
.rhs-flash-line{
  stroke:var(--focus) !important;
  stroke-width:9px !important;
  stroke-dasharray:none !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 8px var(--focusSoft)) drop-shadow(0 0 15px var(--focus));
  animation:rhsLinePulse .72s ease-in-out infinite;
}
.rhs-flash-right{
  stroke:var(--focus) !important;
  stroke-width:5px !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 8px var(--focusSoft)) drop-shadow(0 0 14px var(--focus));
  animation:rhsRightBlink .55s ease-in-out 4;
}
@keyframes rhsLinePulse{
  0%,100%{stroke-width:8px;filter:drop-shadow(0 0 5px var(--focusSoft))}
  50%{stroke-width:11px;filter:drop-shadow(0 0 10px var(--focusSoft)) drop-shadow(0 0 16px var(--focus))}
}
@keyframes rhsRightBlink{
  0%,100%{opacity:1}
  50%{opacity:.08}
}

/* 16, 17단계 요약 장면용 애니메이션 */
.summary-flash-line{
  stroke:var(--focus) !important;
  stroke-width:8px !important;
  stroke-dasharray:none !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 8px var(--focusSoft)) drop-shadow(0 0 15px var(--focus));
  animation:summaryLinePulse .9s ease-in-out infinite;
}
.summary-flash-dot{
  fill:var(--focus) !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 7px var(--focusSoft)) drop-shadow(0 0 14px var(--focus));
  animation:summaryDotPulse .8s ease-in-out infinite;
}
.summary-flash-text{
  fill:var(--focus) !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 7px var(--focusSoft));
  animation:summaryTextBlink .85s ease-in-out infinite;
}
@keyframes summaryLinePulse{
  0%,100%{stroke-width:7px}
  50%{stroke-width:10px}
}
@keyframes summaryDotPulse{
  0%,100%{opacity:1}
  50%{opacity:.3}
}
@keyframes summaryTextBlink{
  0%,100%{opacity:1}
  50%{opacity:.35}
}


.angle-mark{fill:var(--text);stroke:none}
.angle-x{stroke:var(--text);stroke-width:3;stroke-linecap:round}
.angle-mark-focus{fill:var(--focus)!important;stroke:var(--focus)!important;filter:drop-shadow(0 0 6px var(--focusSoft))}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar">
    <span class="badge" id="stepBadge">1 / 18</span>
    <strong id="stepTitle">삼각형의 세 각의 이등분선</strong>
    <span class="spacer"></span>
    <a class="back" href="../../">← 개념 학습관</a>
  </div>

  <div class="stage">
    <section class="diagram" aria-label="삼각형의 내심 단계별 강의 그림">
      <svg id="svg" viewBox="0 0 720 560" role="img">
        <g id="triLayer"></g>
        <g id="fillLayer"></g>
        <g id="lineLayer"></g>
        <g id="markLayer"></g>
        <g id="textLayer"></g>
      </svg>
    </section>

    <aside class="script" id="scriptPanel" aria-label="설명 자막">
      <p id="scriptText"></p>
    </aside>
  </div>

  <div class="footer">
    <button id="prevBtn" type="button">이전</button>
    <div class="progress"><div id="progressBar"></div></div>
    <span class="small" id="progressText">1단계</span>
    <button class="primary" id="nextBtn" type="button">다음</button>
  </div>
</div>

<script>
(() => {
  const NS="http://www.w3.org/2000/svg";
  const app=document.getElementById("app");
  const triLayer=document.getElementById("triLayer");
  const fillLayer=document.getElementById("fillLayer");
  const lineLayer=document.getElementById("lineLayer");
  const markLayer=document.getElementById("markLayer");
  const textLayer=document.getElementById("textLayer");

  const A={x:305,y:80}, B={x:105,y:495}, C={x:625,y:495};
  const dist=(P,Q)=>Math.hypot(P.x-Q.x,P.y-Q.y);
  const a=dist(B,C), b=dist(C,A), c=dist(A,B);
  const I={x:(a*A.x+b*B.x+c*C.x)/(a+b+c),y:(a*A.y+b*B.y+c*C.y)/(a+b+c)};

  function foot(P,U,V){
    const vx=V.x-U.x, vy=V.y-U.y;
    const t=((P.x-U.x)*vx+(P.y-U.y)*vy)/(vx*vx+vy*vy);
    return {x:U.x+t*vx,y:U.y+t*vy};
  }
  const D=foot(I,A,B), E=foot(I,B,C), F=foot(I,C,A);
  const r=dist(I,E);

  function add(tag,attrs,parent=lineLayer){
    const el=document.createElementNS(NS,tag);
    Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));
    parent.appendChild(el); return el;
  }
  function line(P,Q,cls,key,parent=lineLayer,id=""){
    const attrs={x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,class:`shape ${cls}`,"data-key":key};
    if(id) attrs.id=id;
    return add("line",attrs,parent);
  }
  function poly(points,cls,key,parent=fillLayer,id=""){
    const attrs={points:points.map(p=>`${p.x},${p.y}`).join(" "),class:`shape ${cls}`,"data-key":key};
    if(id) attrs.id=id;
    return add("polygon",attrs,parent);
  }
  function text(P,s,cls,key,dx=0,dy=0,parent=textLayer,id=""){
    const attrs={x:P.x+dx,y:P.y+dy,class:`shape ${cls}`,"data-key":key};
    if(id) attrs.id=id;
    const el=add("text",attrs,parent); el.textContent=s; return el;
  }
  function dot(P,cls,key,parent=markLayer,id=""){
    const attrs={cx:P.x,cy:P.y,r:6,class:`shape ${cls}`,"data-key":key};
    if(id) attrs.id=id;
    return add("circle",attrs,parent);
  }
  function rightMarker(P,U,V,key,id=""){
    let ux=V.x-U.x, uy=V.y-U.y; const ul=Math.hypot(ux,uy); ux/=ul; uy/=ul;
    let vx=I.x-P.x, vy=I.y-P.y; const vl=Math.hypot(vx,vy); vx/=vl; vy/=vl;
    const s=15;
    return poly([P,{x:P.x+ux*s,y:P.y+uy*s},{x:P.x+ux*s+vx*s,y:P.y+uy*s+vy*s},{x:P.x+vx*s,y:P.y+vy*s}],"right",key,markLayer,id);
  }

  // 삼각형 기본
  line(A,B,"mainline","triangle",triLayer,"ABline");
  line(B,C,"mainline","triangle",triLayer,"BCline");
  line(C,A,"mainline","triangle",triLayer,"CAline");

  dot(A,"pt","vertexDots",markLayer,"dotA");
  dot(B,"pt","vertexDots",markLayer,"dotB");
  dot(C,"pt","vertexDots",markLayer,"dotC");
  text(A,"A","txt","vertexLabels",-10,-16,textLayer,"labelA");
  text(B,"B","txt","vertexLabels",-26,12,textLayer,"labelB");
  text(C,"C","txt","vertexLabels",12,12,textLayer,"labelC");

  // 각의 이등분 표시
  // A에서는 같은 점 두 개, B에서는 같은 x표 두 개를 사용하여
  // 서로 다른 각의 '같음' 표시가 섞이지 않도록 한다.
  function unitFrom(P,Q){
    const dx=Q.x-P.x, dy=Q.y-P.y, l=Math.hypot(dx,dy);
    return {x:dx/l,y:dy/l};
  }
  function anglePoint(V, P1, P2, radius){
    const u1=unitFrom(V,P1), u2=unitFrom(V,P2);
    let vx=u1.x+u2.x, vy=u1.y+u2.y;
    const l=Math.hypot(vx,vy);
    vx/=l; vy/=l;
    return {x:V.x+vx*radius,y:V.y+vy*radius};
  }
  function betweenDir(V,P1,P2,t){
    const u1=unitFrom(V,P1), u2=unitFrom(V,P2);
    let vx=(1-t)*u1.x+t*u2.x, vy=(1-t)*u1.y+t*u2.y;
    const l=Math.hypot(vx,vy);
    return {x:vx/l,y:vy/l};
  }
  function markDotAt(V,P1,P2,t,radius,id){
    const u=betweenDir(V,P1,P2,t);
    return add("circle",{cx:V.x+u.x*radius,cy:V.y+u.y*radius,r:5,class:"shape angle-mark","data-key":"angleMarksA",id:id},markLayer);
  }
  function markXAt(V,P1,P2,t,radius,idPrefix){
    const u=betweenDir(V,P1,P2,t);
    const px=V.x+u.x*radius, py=V.y+u.y*radius, s=6;
    const l1=add("line",{x1:px-s,y1:py-s,x2:px+s,y2:py+s,class:"shape angle-x","data-key":"angleMarksB",id:idPrefix+"a"},markLayer);
    const l2=add("line",{x1:px-s,y1:py+s,x2:px+s,y2:py-s,class:"shape angle-x","data-key":"angleMarksB",id:idPrefix+"b"},markLayer);
    return [l1,l2];
  }

  // A각: AB와 AI 사이 / AI와 AC 사이 -> 같은 점 표시
  markDotAt(A,B,I,0.55,52,"angleA1");
  markDotAt(A,I,C,0.45,52,"angleA2");

  // B각: BA와 BI 사이 / BI와 BC 사이 -> 같은 x표 표시
  markXAt(B,A,I,0.55,52,"angleB1");
  markXAt(B,I,C,0.45,52,"angleB2");


  line(A,I,"bisector","bisA",lineLayer,"bisAline");
  line(B,I,"bisector","bisB",lineLayer,"bisBline");
  line(C,I,"bisectorC","bisC",lineLayer,"bisCline");

  dot(I,"ptI","I",markLayer,"pointI");
  text(I,"I","txt","I",12,-10,textLayer,"labelI");

  line(I,D,"helper","perps",lineLayer,"perpD");
  line(I,E,"helper","perps",lineLayer,"perpE");
  line(I,F,"helper","perps",lineLayer,"perpF");
  dot(D,"pt","feet",markLayer,"pointD"); dot(E,"pt","feet",markLayer,"pointE"); dot(F,"pt","feet",markLayer,"pointF");
  text(D,"D","txtSmall","feet",-22,3,textLayer,"labelD");
  text(E,"E","txtSmall","feet",-5,25,textLayer,"labelE");
  text(F,"F","txtSmall","feet",12,4,textLayer,"labelF");
  rightMarker(D,A,B,"rightmarks","rightD");
  rightMarker(E,B,C,"rightmarks","rightE");
  rightMarker(F,C,A,"rightmarks","rightF");

  line(C,I,"connect","CI",lineLayer,"CIline");
add("circle",{cx:I.x,cy:I.y,r:r,class:"shape incircle","data-key":"incircle",id:"incircle"},lineLayer);
  text({x:360,y:532},"ID = IE = IF","eq","equalText",-123,0,textLayer,"equalTextLabel");
  text({x:360,y:92},"세 내각의 이등분선은 한 점에서 만난다","eq","conclusion",-190,0,textLayer,"conclusionText");

  const steps = [
    {
      title:"삼각형의 세 각의 이등분선",
      show:["triangle","vertexDots","vertexLabels"],
      animate:["labelA","labelB","labelC","dotA","dotB","dotC"],
      animation:"blink-now",
      focus:[],
      dimOthers:false,
      script:"삼각형의 세 내각의 이등분선에는 어떤 관계가 있을까요?",
      cue:"앞으로 살펴볼 내용을 짐작할 수 있도록 질문을 먼저 제시합니다."
    },
    {
      title:"삼각형을 살펴보기",
      show:["triangle","vertexDots","vertexLabels"],
      animate:["labelA","labelB","labelC","dotA","dotB","dotC"],
      animation:"blink-now",
      focus:[],
      dimOthers:false,
      script:"그림의 삼각형 ABC를 살펴봅시다.",
      cue:"이 문장을 읽는 동안 꼭짓점 에이, 비, 씨가 세 번 깜빡입니다."
    },
    {
      title:"두 각의 이등분선 그리기",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","angleMarksA","angleMarksB"],
      animate:["bisAline","bisBline"],
      animation:"draw-now",
      focus:["bisAline","bisBline","angleA1","angleA2","angleB1a","angleB1b","angleB2a","angleB2b"],
      dimOthers:false,
      script:"먼저 ∠A의 이등분선과 ∠B의 이등분선을 그어 봅니다.",
      cue:"두 이등분선이 선명한 주황색 강조와 함께 실제로 그어집니다."
    },
    {
      title:"두 이등분선의 교점",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","angleMarksA","angleMarksB"],
      animate:["pointI","labelI"],
      animation:"blink-now",
      focus:["pointI","labelI"],
      dimOthers:false,
      script:"두 이등분선이 만나는 점을 점 I라고 하겠습니다.",
      cue:"점 I와 글자 아이가 강하게 깜빡이며 시선을 모읍니다."
    },
    {
      title:"세 변에 수선을 내리기",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      animate:["perpD","perpE","perpF"],
      animation:"draw-now",
      focus:["perpD","perpE","perpF","pointD","pointE","pointF"],
      dimOthers:false,
      script:"그리고 점 I에서 삼각형의 세 변에 수선을 내립니다.",
      cue:"세 수선이 굵고 밝게 강조되며 동시에 그어집니다."
    },
    {
      title:"수선의 발 이름 붙이기",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      focus:["pointD","pointE","pointF","labelD","labelE","labelF"],
      dimOthers:false,
      script:"변 AB에 내린 수선의 발을 점 D, 변 BC에 내린 수선의 발을 점 E, 변 CA에 내린 수선의 발을 점 F라고 하겠습니다.",
      cue:"디, 이, 에프의 이름표를 확실히 보여 줍니다."
    },
    {
      title:"각의 이등분선 위 점의 성질",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      focus:["bisAline","bisBline","pointI"],
      dimOthers:false,
      script:"각의 이등분선 위에 있는 점은 그 각을 이루는 두 변까지의 거리가 같습니다.",
      cue:"지금은 이등분선과 점 I 자체에 주목합니다."
    },
    {
      title:"∠A의 이등분선에서",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      animate:["perpD","perpF"],
      animation:"glow-now",
      focus:["perpD","perpF","pointD","pointF","labelD","labelF"],
      dimOthers:false,
      script:"점 I는 ∠A의 이등분선 위에 있으므로, 선분 ID와 선분 IF의 길이는 같습니다.",
      cue:"아이 디와 아이 에프만 밝게 살아나도록 만들었습니다."
    },
    {
      title:"∠B의 이등분선에서",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      animate:["perpD","perpE"],
      animation:"glow-now",
      focus:["perpD","perpE","pointD","pointE","labelD","labelE"],
      dimOthers:false,
      script:"또 점 I는 ∠B의 이등분선 위에 있으므로, 선분 ID와 선분 IE의 길이도 같습니다.",
      cue:"이번에는 아이 디와 아이 이만 확실하게 드러납니다."
    },
    {
      title:"세 변까지의 거리는 같다",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","equalText","angleMarksA","angleMarksB"],
      animate:["perpD","perpE","perpF","equalTextLabel"],
      animation:"glow-now",
      focus:["perpD","perpE","perpF","pointD","pointE","pointF","labelD","labelE","labelF","equalTextLabel"],
      dimOthers:false,
      script:"그러므로 선분 ID, 선분 IE, 선분 IF의 길이는 모두 같습니다.",
      cue:"세 수선과 등식이 또렷하게 보이도록 했습니다."
    },
    {
      title:"점 C와 점 I 연결",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","I","perps","feet","rightmarks","CI","angleMarksA","angleMarksB"],
      animate:["CIline"],
      animation:"draw-now",
      focus:["CIline","labelC","pointI","labelI"],
      dimOthers:false,
      script:"이제 점 C와 점 I를 연결해 봅시다.",
      cue:"씨와 아이를 잇는 선분이 가장 도드라져 보입니다."
    },
    {
      title:"비교할 두 직각삼각형",
      show:["triangle","vertexDots","vertexLabels","I","perps","feet","rightmarks","CI"],
      animate:["CIline","perpE","perpF"],
      animation:"glow-now",
      focus:["CIline","perpE","perpF","pointE","pointF","labelE","labelF"],
      dimOthers:false,
      script:"그러면 두 개의 직각삼각형, 삼각형 ICE와 삼각형 ICF를 비교할 수 있습니다.",
      cue:"새로운 선이나 색칠을 만들지 않고, 이미 그려진 IC, IE, IF만 강조합니다."
    },
    {
      title:"직각삼각형의 합동",
      show:["triangle","vertexDots","vertexLabels","I","perps","feet","rightmarks","CI"],
      focus:[],
      dimOthers:false,
      sequence:"rhs",
      script:"두 삼각형은 모두 직각삼각형입니다.\n\n선분 IC는 두 삼각형의 공통인 빗변입니다.\n\n또 선분 IE와 선분 IF의 길이는 같습니다.\n\n따라서 두 직각삼각형은 서로 합동입니다.",
      cue:"이 단계에서는 직각 표시 → 빗변 IC → IE와 IF 순서로 하나씩만 강조됩니다."
    },
    {
      title:"∠C의 이등분선",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","bisC","I","perps","feet","rightmarks","angleMarksA","angleMarksB"],
      animate:["bisCline"],
      animation:"draw-now",
      focus:["bisCline","labelC","pointI","labelI"],
      dimOthers:false,
      script:"따라서 점 C에서 만들어지는 두 각의 크기도 같습니다. 즉, 선분 CI는 ∠C의 이등분선입니다.",
      cue:"씨의 이등분선이 새로 등장하면서 결론이 드러납니다."
    },
    {
      title:"세 이등분선과 내심",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","bisC","I","conclusion","angleMarksA","angleMarksB"],
      animate:["pointI","labelI","conclusionText"],
      animation:"blink-now",
      focus:["pointI","labelI","conclusionText"],
      dimOthers:false,
      script:"따라서 삼각형의 세 내각의 이등분선은 한 점에서 만납니다. 이 점을 삼각형의 내심이라고 합니다.",
      cue:"점 I와 결론 문장을 함께 강하게 보여 줍니다."
    },
    {
      title:"내심과 내접원",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","bisC","I","incircle","angleMarksA","angleMarksB"],
      animate:["incircle"],
      animation:"draw-now",
      focus:["incircle","pointI","labelI"],
      dimOthers:false,
      script:"내심에서 삼각형의 세 변까지의 거리는 모두 같습니다. 따라서 내심을 중심으로 원을 그리면 그 원은 삼각형의 세 변에 모두 접합니다. 이 원을 삼각형의 내접원이라고 합니다.",
      cue:"내접원이 가장 먼저 눈에 들어오도록 했습니다."
    },
    {
      title:"정리 1. 내심",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","bisC","I","conclusion","angleMarksA","angleMarksB"],
      focus:[],
      dimOthers:false,
      sequence:"summary_incenter",
      script:"1. 삼각형의 세 내각의 이등분선은 한 점, 내심에서 만난다.",
      cue:"세 이등분선이 차례로 강조된 뒤, 마지막에 내심과 정리 문장이 함께 강조됩니다."
    },
    {
      title:"정리 2. 내심에서 세 변까지의 거리",
      show:["triangle","vertexDots","vertexLabels","bisA","bisB","bisC","I","perps","feet","rightmarks","equalText","angleMarksA","angleMarksB"],
      focus:[],
      dimOthers:false,
      sequence:"summary_distance",
      script:"2. 내심에서 삼각형의 세 변에 이르는 거리는 모두 같다.",
      cue:"ID, IE, IF가 차례로 강조된 뒤, 마지막에 세 거리와 등식이 함께 강조됩니다."
    }
  ];

  let idx=0;
  const all=[...document.querySelectorAll("[data-key]")];
  const allById=[...document.querySelectorAll("#svg [id]")];
  const titleEl=document.getElementById("stepTitle");
  const badgeEl=document.getElementById("stepBadge");
  const scriptText=document.getElementById("scriptText");
  const prev=document.getElementById("prevBtn");
  const next=document.getElementById("nextBtn");
  const bar=document.getElementById("progressBar");
  const progressText=document.getElementById("progressText");

  let sequenceTimers=[];

  function clearSequenceTimers(){
    sequenceTimers.forEach(t=>clearTimeout(t));
    sequenceTimers=[];
  }

  function clearRhsFocus(){
    document.querySelectorAll(".rhs-flash-line,.rhs-flash-right,.summary-flash-line,.summary-flash-dot,.summary-flash-text").forEach(el=>{
      el.classList.remove("rhs-flash-line","rhs-flash-right","summary-flash-line","summary-flash-dot","summary-flash-text");
    });
  }

  function clearEffects(){
    clearSequenceTimers();
    clearRhsFocus();
    document.querySelectorAll(".draw-now,.blink-now,.pop-now,.glow-now,.dimmed,.focus-stroke,.focus-fill,.focus-text,.focus-dot,.pulse-focus").forEach(el=>{
      el.classList.remove("draw-now","blink-now","pop-now","glow-now","dimmed","focus-stroke","focus-fill","focus-text","focus-dot","pulse-focus");
    });
  }

  function rhsFocus(ids, cls){
    clearRhsFocus();
    ids.forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.classList.add(cls);
    });
  }

  function runRhsSequence(){
    clearSequenceTimers();
    clearRhsFocus();

    // ① "두 삼각형은 모두 직각삼각형입니다."
    rhsFocus(["rightE","rightF"], "rhs-flash-right");

    // ② "선분 IC는 두 삼각형의 공통인 빗변입니다."
    sequenceTimers.push(setTimeout(()=>{
      rhsFocus(["CIline"], "rhs-flash-line");
    }, 2600));

    // ③ "선분 IE와 선분 IF의 길이는 같습니다."
    sequenceTimers.push(setTimeout(()=>{
      rhsFocus(["perpE","perpF"], "rhs-flash-line");
    }, 5400));

    // ④ 합동 결론에서는 강조를 해제하여 그림 전체를 다시 보게 함
    sequenceTimers.push(setTimeout(()=>{
      clearRhsFocus();
    }, 8400));
  }

  function runSummaryIncenterSequence(){
    clearSequenceTimers();
    clearRhsFocus();

    ["bisAline","bisBline","bisCline"].forEach((id, idx)=>{
      sequenceTimers.push(setTimeout(()=>{
        clearRhsFocus();
        const el=document.getElementById(id);
        if(el) el.classList.add("summary-flash-line");
      }, idx*1100));
    });

    sequenceTimers.push(setTimeout(()=>{
      clearRhsFocus();
      ["bisAline","bisBline","bisCline","pointI","labelI","conclusionText"].forEach(id=>{
        const el=document.getElementById(id);
        if(!el) return;
        if(id==="pointI") el.classList.add("summary-flash-dot");
        else if(id==="labelI" || id==="conclusionText") el.classList.add("summary-flash-text");
        else el.classList.add("summary-flash-line");
      });
    }, 3500));

    sequenceTimers.push(setTimeout(()=>{
      clearRhsFocus();
    }, 6800));
  }

  function runSummaryDistanceSequence(){
    clearSequenceTimers();
    clearRhsFocus();

    ["perpD","perpE","perpF"].forEach((id, idx)=>{
      sequenceTimers.push(setTimeout(()=>{
        clearRhsFocus();
        const line=document.getElementById(id);
        if(line) line.classList.add("summary-flash-line");
      }, idx*1100));
    });

    sequenceTimers.push(setTimeout(()=>{
      clearRhsFocus();
      ["perpD","perpE","perpF","equalTextLabel","pointI","labelI"].forEach(id=>{
        const el=document.getElementById(id);
        if(!el) return;
        if(id==="pointI") el.classList.add("summary-flash-dot");
        else if(id==="labelI" || id==="equalTextLabel") el.classList.add("summary-flash-text");
        else el.classList.add("summary-flash-line");
      });
    }, 3500));

    sequenceTimers.push(setTimeout(()=>{
      clearRhsFocus();
    }, 6800));
  }

  function applyFocus(step){
    if(!step.focus || step.focus.length===0) return;
    const focusSet=new Set(step.focus);
    allById.forEach(el=>{
      if(step.dimOthers && !el.classList.contains("off") && !focusSet.has(el.id)){
        // data-key가 없는 그룹 컨테이너는 제외
        if(el.tagName !== "g") el.classList.add("dimmed");
      }
    });
    step.focus.forEach(id=>{
      const el=document.getElementById(id);
      if(!el) return;
      const tag=el.tagName.toLowerCase();
      if(tag==="line"){
        el.classList.add("focus-stroke","pulse-focus");
      }else if(tag==="polygon"){
        el.classList.add("focus-stroke","pulse-focus");
      }else if(tag==="circle"){
        if(el.id==="incircle"){
          el.classList.add("focus-stroke","pulse-focus");
        }else{
          el.classList.add("focus-dot","pulse-focus");
        }
      }else if(tag==="text"){
        el.classList.add("focus-text","pulse-focus");
      }
    });
  }

  function replayAnimation(step){
    if(!step.animate || !step.animation) return;
    void document.body.offsetWidth;
    step.animate.forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.classList.add(step.animation);
    });
  }

  function render(){
    const s=steps[idx];
    clearEffects();
    all.forEach(el=>el.classList.toggle("off", !s.show.includes(el.getAttribute("data-key"))));
    titleEl.textContent=s.title;
    badgeEl.textContent=`${idx+1} / ${steps.length}`;
    scriptText.textContent=s.script;
    prev.disabled=idx===0;
    next.disabled=idx===steps.length-1;
    bar.style.width=`${((idx+1)/steps.length)*100}%`;
    progressText.textContent=`${idx+1}단계`;
    applyFocus(s);
    replayAnimation(s);
    if(s.sequence==="rhs") runRhsSequence();
    if(s.sequence==="summary_incenter") runSummaryIncenterSequence();
    if(s.sequence==="summary_distance") runSummaryDistanceSequence();
  }

  prev.addEventListener("click",()=>{if(idx>0){idx--;render();}});
  next.addEventListener("click",()=>{if(idx<steps.length-1){idx++;render();}});
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"&&idx<steps.length-1){idx++;render();}
    if(e.key==="ArrowLeft"&&idx>0){idx--;render();}
    if(e.key===" "){e.preventDefault();render();}
  });
  render();
})();
</script>
</body>
</html>
