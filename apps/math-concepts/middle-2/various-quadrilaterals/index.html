<!doctype html>
<html lang="ko">

<meta charset="utf-8">

<title>여러 가지 사각형의 성질</title>
<style>
:root{--ink:#18324a;--muted:#617384;--paper:#f6f3ed;--card:#fffdfa;--line:#2d4b61;--blue:#2076b8;--blue-soft:#e8f4fb;--orange:#f08a3c;--green:#2f9568;--green-soft:#e8f6ef;--teal:#3c9f9a;--purple:#8b71b5;--gold:#cf9b3c;--red:#d65c5c;--shadow:0 18px 55px rgba(28,54,75,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:74px;padding:0 clamp(18px,3vw,42px);display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid #dce4e8}.brand{font-weight:800;letter-spacing:-.04em;white-space:nowrap}.step-label{margin-left:auto;font-weight:800;color:var(--blue)}.progress{height:7px;background:#dce7ec}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .35s ease}.stage{width:min(1180px,calc(100% - 32px));margin:24px auto 16px;flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);gap:26px;align-items:stretch}.visual,.lesson{background:var(--card);border:1px solid #dbe4e7;border-radius:26px;box-shadow:var(--shadow)}.visual{min-height:560px;padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.lesson{padding:34px;display:flex;flex-direction:column}.kicker{font-size:.9rem;color:var(--blue);font-weight:800;margin-bottom:9px}.lesson h1{font-size:clamp(1.7rem,3vw,2.55rem);line-height:1.22;letter-spacing:-.045em;margin:0 0 16px}.question{font-size:1.14rem;line-height:1.7;margin:0 0 20px;color:#314c60}.math-list{display:flex;flex-direction:column;gap:10px}.math-btn,.choice,.primary,.secondary,.nav-btn,.answer-btn{border:0;border-radius:13px;min-height:48px}.math-btn{position:relative;text-align:left;background:transparent;padding:11px 36px 9px 12px;border-bottom:2px dotted var(--blue);border-radius:8px;color:var(--blue);font-weight:800;line-height:1.45}.math-btn::after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.35rem}.math-btn.checked{color:var(--green);border-bottom-color:var(--green);background:var(--green-soft)}.math-btn.checked::after{content:"✓"}.math-btn:disabled{opacity:.4;cursor:not-allowed}.hint{margin-top:auto;padding-top:18px;color:var(--muted);font-size:.9rem}.diagram{width:100%;max-height:460px}.shape{fill:#eef5f7;stroke:var(--line);stroke-width:4;stroke-linejoin:round}.edge,.diag,.helper{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}.diag{stroke-width:3}.helper{stroke-dasharray:8 8;stroke:#8ea1ad}.label{font-size:22px;font-weight:800;fill:var(--ink)}.small-label{font-size:17px;font-weight:700;fill:var(--ink)}.mark{fill:none;stroke-width:4;stroke-linecap:round}.pair-a{stroke:var(--teal)!important;color:var(--teal)}.pair-b{stroke:var(--purple)!important;color:var(--purple)}.pair-c{stroke:var(--gold)!important;color:var(--gold)}.right{stroke:var(--red)!important}.hidden{opacity:0;pointer-events:none}.shown{opacity:1;transition:opacity .25s ease}.pulse{animation:pulse .42s ease-in-out 3;transform-origin:center}.pulse-line{animation:pulseLine .42s ease-in-out 3}@keyframes pulse{50%{filter:drop-shadow(0 0 10px rgba(240,138,60,.95));transform:scale(1.035)}}@keyframes pulseLine{50%{stroke:var(--orange)!important;stroke-width:8}}.caption{width:min(1180px,calc(100% - 32px));margin:0 auto 18px;background:#173a51;color:#fff;border-radius:18px;padding:17px 22px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 10px 28px rgba(23,58,81,.18)}.caption b{white-space:nowrap;color:#9ddce0}.caption span{line-height:1.6}.controls{padding:0 clamp(18px,3vw,42px) 22px;display:flex;justify-content:center;align-items:center;gap:12px}.nav-btn,.primary,.secondary,.choice,.answer-btn{padding:11px 18px;font-weight:800}.nav-btn{background:#fff;border:1px solid #cfdce2}.nav-btn:disabled{opacity:.35;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.secondary{background:#e9eff2}.choice{background:#fff;border:2px solid #cfdce2;min-width:110px}.choice:hover,.choice.selected{border-color:var(--blue);background:var(--blue-soft)}.choice.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}.choice.wrong{border-color:var(--red);background:#fff0f0;color:var(--red)}.big-question{text-align:center;font-size:clamp(1.65rem,4vw,3rem);font-weight:900;letter-spacing:-.05em;line-height:1.35}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.shape-card{background:#f0f6f7;border-radius:20px;padding:18px;text-align:center}.shape-card h3{margin:8px 0 0}.answer-row{display:flex;gap:10px;flex-wrap:wrap}.feedback{min-height:48px;margin-top:13px;padding:12px 14px;border-radius:12px;background:#eef3f5;font-weight:700;line-height:1.5}.feedback.good{background:var(--green-soft);color:#216f4d}.feedback.bad{background:#fff0f0;color:#a33e3e}.input-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f0f5f7;padding:12px 14px;border-radius:14px}.input-line input{width:88px;padding:10px;border:2px solid #bdd0da;border-radius:10px;text-align:center;font-weight:800;background:#fff}.property-card{border-left:5px solid var(--teal);background:#eef7f5;border-radius:15px;padding:15px 18px;line-height:1.6;margin-top:8px}.property-card strong{color:#21746f}.relation-map{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}.node{min-width:190px;padding:11px 18px;text-align:center;border-radius:16px;background:#fff;border:2px solid #aebfc8;font-weight:800}.node.active{border-color:var(--orange);box-shadow:0 0 0 5px rgba(240,138,60,.15)}.node-row{display:flex;gap:28px;align-items:center}.arrow{color:#8196a2;font-size:1.25rem}.condition-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.condition{border:1px solid #ccd9df;background:#fff;border-radius:13px;padding:11px;text-align:left;font-weight:700}.condition.active{border-color:var(--orange);background:#fff5eb}.tree{display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center}.tree-question{font-size:1.35rem;font-weight:900;background:#eff6f8;padding:16px 22px;border-radius:18px}.tree-result{font-size:2.15rem;font-weight:900;color:var(--green);min-height:54px}.confetti{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}.mini-note{font-size:.9rem;color:var(--muted);line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.stage{grid-template-columns:1fr}.visual{min-height:390px}.lesson{min-height:430px}.diagram{max-height:340px}.caption{font-size:.94rem}.topbar{height:64px}.brand{font-size:.92rem}}
@media(max-width:520px){.stage{width:min(100% - 20px,1180px);margin-top:12px;gap:14px}.visual,.lesson{border-radius:18px}.visual{padding:12px;min-height:330px}.lesson{padding:22px;min-height:390px}.compare,.condition-grid{grid-template-columns:1fr}.node-row{gap:8px}.node{min-width:132px;padding:9px;font-size:.88rem}.caption{width:calc(100% - 20px);padding:14px 16px;display:block}.caption b{display:block;margin-bottom:5px}.controls{padding-bottom:16px}.nav-btn{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* 클릭한 식은 주황색으로 세 번 확인한 뒤 초록색 완료 상태가 된다. */
.math-btn.flash{animation:buttonPulse .42s ease-in-out 3;color:var(--orange);border-bottom-color:var(--orange)}
.math-btn.flash:disabled{opacity:1}
@keyframes buttonPulse{50%{background:#fff0e3;box-shadow:0 0 0 4px rgba(240,138,60,.16)}}
/* 도형 표시는 교실 뒤에서도 구분되도록 높은 대비와 굵은 선을 사용한다. */
.pair-a{stroke:#007f78!important;color:#007f78}.pair-b{stroke:#6936b3!important;color:#6936b3}.pair-c{stroke:#b56500!important;color:#b56500}.right{stroke:#d12626!important}
.shown .pair-a,.shown.pair-a,.shown .pair-b,.shown.pair-b,.shown .pair-c,.shown.pair-c{stroke-width:7}
.explanation-card{margin-top:16px;padding:16px 18px;border-radius:15px;background:#edf4f7;border-left:5px solid var(--blue);font-weight:700;line-height:1.65;color:#29475c}
.caption{display:none}
</style>
</head>

{title:"어떤 성질이 숨어 있을까요?",kicker:"생각 열기",question:"직사각형과 마름모에 대각선을 그으면, 어떤 공통점과 차이점이 나타날까요?",visual:C.intro,actions:[{label:"두 대각선의 길이는 언제 같을까?",id:"intro1",reveal:"intro-equal",target:".target-intro-equal"},{label:"두 대각선은 언제 수직으로 만날까?",id:"intro2",reveal:"intro-perp",target:".target-intro-perp"}],caption:"두 문장을 차례로 눌러 직사각형과 마름모의 대각선 모양을 비교해 봅시다. 뒤의 단계에서는 평행사변형의 성질과 삼각형의 합동을 이용해 그 이유를 설명합니다."},
{title:"직사각형도 평행사변형일까요?",kicker:"직사각형에서 출발",question:"직사각형은 네 각이 모두 직각입니다. 마주 보는 두 변은 각각 평행하므로 평행사변형의 성질을 그대로 이용할 수 있습니다.",visual:C.rectLink,actions:[{label:"AB ∥ DC, AD ∥ BC",id:"rectParallel",reveal:"parallel",target:".target-parallel"},{label:"AO = OC, BO = OD",id:"rectBisect",reveal:"bisect",target:".target-bisect",after:"rectParallel"}],caption:"직사각형은 네 각이 모두 직각인 사각형입니다. 따라서 두 쌍의 대변이 각각 평행하고, 평행사변형이므로 두 대각선은 서로를 이등분합니다."},
{title:"직사각형의 두 대각선은 왜 같을까요?",kicker:"SAS 합동으로 증명",question:"대각선을 그은 뒤 △ABC와 △DCB를 비교해 봅시다. 파란 점선 밑줄을 순서대로 누르세요.",visual:C.rectProof,actions:[{label:"대각선 AC, BD를 그어 봅시다",id:"diags",reveal:"diags",target:".target-diags"},{label:"AB = DC",id:"pairs",reveal:"pairs",target:".target-pairs",after:"diags"},{label:"∠ABC = ∠DCB = 90°",id:"right",reveal:"right",target:".target-right",after:"pairs"},{label:"BC는 공통인 변",id:"common",reveal:"common",target:".target-common",after:"right"},{label:"△ABC ≡ △DCB (SAS)",id:"triangles",reveal:"triangles",target:".target-triangles",after:"common"},{label:"따라서 AC = DB",id:"result",reveal:"result",target:".target-result",after:"triangles"}],caption:"두 삼각형에서 한 쌍의 변은 직사각형의 대변이라 같고, 끼인각은 모두 직각이며, 다른 한 변은 공통입니다. 따라서 SAS 합동이고, 대응하는 두 대각선의 길이는 같습니다."},
{title:"직사각형의 대각선 성질",kicker:"한 문장으로 정리",question:"직사각형은 평행사변형이므로 서로를 이등분하고, 방금 합동으로 두 대각선의 길이가 같다는 것도 확인했습니다.",visual:C.rectO,actions:[{label:"AC = BD",id:"equal",reveal:"equal",target:".target-equal"},{label:"AO = OC, BO = OD",id:"half",hide:"equal",reveal:"half",target:".target-half",after:"equal"}],note:"직사각형에서 두 대각선은 길이가 같고, 서로를 이등분한다.",caption:"두 대각선 전체의 길이가 같다는 표시와, 교점 O가 각 대각선을 반으로 나눈다는 표시를 구분해서 확인해 봅시다."},
{title:"직사각형 확인 문제",kicker:"직접 계산",question:"직사각형 ABCD에서 AC = 14 cm이고 두 대각선의 교점이 O일 때, BD와 OC의 길이를 구해 봅시다.",visual:C.rectO,custom:"rectQuiz",caption:"직사각형의 두 대각선은 길이가 같으므로 BD는 14센티미터입니다. 또 두 대각선은 서로를 이등분하므로 OC는 AC의 절반인 7센티미터입니다."},
{title:"마름모에서 이미 아는 것은?",kicker:"평행사변형의 성질 연결",question:"마름모는 네 변의 길이가 모두 같은 평행사변형입니다. 그러므로 대각선의 교점 O는 각 대각선의 가운데입니다.",visual:C.rhombus,actions:[{label:"대각선 AC, BD를 그어 봅시다",id:"diags",reveal:"diags",target:".target-diags"},{label:"AB = BC = CD = DA",id:"sides",reveal:"sides",target:".target-sides",after:"diags"},{label:"AO = OC, BO = OD",id:"halves",reveal:"half-ac,half-bd",target:".target-half-ac,.target-half-bd",after:"sides"}],caption:"마름모는 네 변의 길이가 모두 같은 사각형입니다. 두 쌍의 대변 길이가 각각 같으므로 평행사변형이고, 따라서 두 대각선은 서로를 이등분합니다."},
{title:"마름모의 두 대각선은 왜 수직일까요?",kicker:"SSS 합동으로 증명",question:"△AOB와 △AOD를 비교하면 세 쌍의 변의 길이가 각각 같습니다.",visual:C.rhombus,actions:[{label:"△AOB와 △AOD",id:"tris",reveal:"diags,tris",target:".target-tris"},{label:"AB = AD",id:"sides",reveal:"proof-sides",target:".target-proof-sides",after:"tris"},{label:"AO는 공통인 변",id:"ao",reveal:"ao",target:".target-ao",after:"sides"},{label:"OB = OD",id:"bo",reveal:"half-bd",target:".target-half-bd",after:"ao"},{label:"△AOB ≡ △AOD (SSS)",id:"sss",reveal:"congruent",target:".target-congruent",after:"bo"},{label:"∠AOB = ∠AOD",id:"angle",reveal:"angle",target:".target-angle",after:"sss"},{label:"두 각의 합은 180° → 각각 90°",id:"right",hide:"angle",reveal:"right",target:".target-right",after:"angle"},{label:"따라서 AC ⟂ BD",id:"perp",target:".target-diags",after:"right"}],caption:"AB와 AD, 공통변 AO, OB와 OD를 각각 따로 확인합니다. 세 조건이 모이면 두 삼각형의 전체 윤곽을 강조하여 SSS 합동임을 정리합니다."},
{title:"마름모의 대각선 성질",kicker:"한 문장으로 정리",question:"평행사변형의 성질과 방금 증명한 수직 관계를 함께 말해 봅시다.",visual:C.rhombus,actions:[{label:"AO = OC, BO = OD",id:"halves",reveal:"diags,half-ac,half-bd",target:".target-half-ac,.target-half-bd"},{label:"AC ⟂ BD",id:"perp",reveal:"right",target:".target-right",after:"halves"}],note:"마름모에서 두 대각선은 서로를 수직이등분한다.",caption:"세로 대각선 AC와 가로 대각선 BD가 각각 O에서 반으로 나뉘는 표시를 확인하고, 두 대각선이 만드는 각이 90도임을 함께 정리합니다."},
{title:"정사각형은 두 성질을 모두 가집니다",kicker:"직사각형이자 마름모",question:"정사각형은 네 각이 모두 직각이므로 직사각형이고, 네 변의 길이가 모두 같으므로 마름모입니다.",visual:C.square,actions:[{label:"직사각형의 성질 → AC = BD",id:"equal",reveal:"equal",target:".target-equal"},{label:"평행사변형의 성질 → 서로 이등분",id:"half",hide:"equal",reveal:"halves",target:".target-halves",after:"equal"},{label:"마름모의 성질 → AC ⟂ BD",id:"perp",reveal:"center-right",target:".target-right",after:"half"}],note:"정사각형의 두 대각선은 길이가 같고, 서로를 수직이등분한다.",caption:"직사각형에서 얻은 같은 길이, 평행사변형에서 얻은 이등분, 마름모에서 얻은 수직 관계를 하나씩 확인해 봅시다."},
{title:"정사각형 확인 문제",kicker:"성질을 함께 사용",question:"정사각형 ABCD에서 AO = 2 cm이고 두 대각선의 교점이 O일 때, BD의 길이와 ∠BOC의 크기를 구해 봅시다.",visual:C.square,custom:"squareQuiz",caption:"AO가 2센티미터이므로 AC는 그 두 배인 4센티미터입니다. 정사각형의 두 대각선은 길이가 같아서 BD도 4센티미터이고, 서로 수직이므로 ∠BOC는 90도입니다."},
{title:"등변사다리꼴에서는 무엇이 같을까요?",kicker:"생각 넓히기",question:"평행하지 않은 두 변의 길이가 같은 사다리꼴을 등변사다리꼴이라고 합니다. 좌우가 서로 비친 모양처럼 대칭입니다.",visual:C.trapezoid,actions:[{label:"AB = DC",id:"legs",reveal:"legs",target:".target-legs"},{label:"대칭축을 기준으로 서로 대응",id:"axis",reveal:"axis",target:".target-axis"},{label:"따라서 AC = DB",id:"diags",reveal:"diags",target:".target-diags",after:"axis"}],note:"등변사다리꼴은 평행하지 않은 두 변의 길이가 같고, 두 대각선의 길이도 같다.",caption:"등변사다리꼴은 평행하지 않은 두 변의 길이가 같습니다. 좌우 대칭인 모양에서 한 대각선을 반대쪽으로 대응시키면 다른 대각선과 겹치므로 두 대각선의 길이도 같습니다."},
{title:"사각형은 서로 어떻게 이어질까요?",kicker:"포함 관계",question:"조건을 하나씩 더할수록 더 특별한 사각형이 됩니다. 아래 조건을 눌러 관계도에서 이동을 확인하세요.",visual:`<div class="relation-map"><div class="node" data-node="quad">사각형</div><div class="arrow">↓</div><div class="node" data-node="trap">사다리꼴</div><div class="arrow">↓</div><div class="node" data-node="para">평행사변형</div><div class="arrow">↓</div><div class="node-row"><div class="node" data-node="rect">직사각형</div><div class="node" data-node="rhomb">마름모</div></div><div class="arrow">↘ &nbsp;&nbsp;&nbsp; ↙</div><div class="node" data-node="square">정사각형</div></div>`,custom:"relations",caption:"사각형에서 한 쌍의 대변이 평행하면 사다리꼴, 다른 한 쌍까지 평행하면 평행사변형입니다. 여기에 한 내각이 직각이면 직사각형, 이웃한 두 변의 길이가 같으면 마름모이며, 두 조건을 모두 만족하면 정사각형입니다."},
{title:"조건을 따라 사각형을 분류해 봅시다",kicker:"마지막 활동",question:"각 질문에 예 또는 아니요로 답해 보세요. 답을 따라가면 가장 알맞은 사각형의 이름을 찾을 수 있습니다.",visual:`<div class="tree"><div class="tree-question" id="treeQuestion"></div><div class="answer-row" id="treeAnswers"><button class="answer-btn primary" data-tree="yes" type="button">예</button><button class="answer-btn secondary" data-tree="no" type="button">아니요</button></div><div class="tree-result" id="treeResult" aria-live="polite"></div><button class="nav-btn hidden" id="treeReset" type="button">다시 분류하기</button></div>`,custom:"tree",caption:"먼저 평행한 대변이 있는지 확인하고, 두 쌍이 모두 평행한지 살펴봅니다. 평행사변형까지 왔다면 직각과 같은 변 조건을 차례로 더하여 직사각형, 마름모, 정사각형을 분류할 수 있습니다."}
];
let current=0,done={};
const stage=document.getElementById('stage'),stepLabel=document.getElementById('stepLabel'),progress=document.getElementById('progressBar'),prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');
function render(){const s=slides[current];done={};stage.innerHTML=`<div class="visual">${s.visual}</div><article class="lesson"><div class="kicker">${s.kicker}</div><h1>${s.title}</h1><p class="question">${s.question}</p><div class="math-list" id="mathList"></div>${s.note?`<div class="property-card"><strong>핵심 성질</strong><br>${s.note}</div>`:''}<div class="explanation-card">${s.caption}</div>${s.actions?'<div class="hint">파란 점선 밑줄을 누르면 그림에서 확인할 수 있습니다.</div>':''}</article>`;stepLabel.textContent=`${current+1} / ${slides.length}`;progress.style.width=`${(current+1)/slides.length*100}%`;prev.disabled=current===0;next.textContent=current===slides.length-1?'처음으로 ↺':'다음 →';if(s.actions)setupActions(s.actions);if(s.custom)setupCustom(s.custom);}
function setupActions(actions){const list=document.getElementById('mathList');list.innerHTML=actions.map(a=>`<button type="button" class="math-btn" data-action="${a.id}" ${a.after?'disabled':''}>${a.label}</button>`).join('');list.addEventListener('click',e=>{const btn=e.target.closest('.math-btn');if(!btn||btn.disabled)return;const a=actions.find(x=>x.id===btn.dataset.action);done[a.id]=true;btn.disabled=true;btn.classList.add('flash');if(a.hide)a.hide.split(',').forEach(k=>stage.querySelectorAll(`.reveal-${k}`).forEach(el=>{el.classList.remove('shown');el.classList.add('hidden')}));if(a.reveal)a.reveal.split(',').forEach(k=>stage.querySelectorAll(`.reveal-${k}`).forEach(el=>{el.classList.remove('hidden');el.classList.add('shown')}));pulseTargets(a.target);setTimeout(()=>{btn.classList.remove('flash');btn.classList.add('checked');actions.filter(x=>x.after===a.id).forEach(x=>{const b=list.querySelector(`[data-action="${x.id}"]`);if(b)b.disabled=false});},1300);});}
function pulseTargets(sel){if(!sel)return;stage.querySelectorAll(sel).forEach(el=>{el.classList.remove('pulse','pulse-line');void el.getBoundingClientRect();el.classList.add(el.matches('line,path,polygon,rect')?'pulse-line':'pulse');setTimeout(()=>el.classList.remove('pulse','pulse-line'),1400)});}
function setupCustom(type){const list=document.getElementById('mathList');if(type==='rectQuiz'){list.innerHTML=`<div class="input-line">BD = <input id="bd" inputmode="numeric" aria-label="BD의 길이"> cm</div><div class="input-line">OC = <input id="oc" inputmode="numeric" aria-label="OC의 길이"> cm</div><button class="primary" id="checkQuiz" type="button">확인하기</button><div class="feedback" id="quizFeedback" aria-live="polite">두 성질을 차례로 사용해 보세요.</div>`;quiz(['bd','oc'],['14','7'],'맞았습니다! BD = 14 cm, OC = 7 cm입니다.');}
if(type==='squareQuiz'){list.innerHTML=`<div class="input-line">BD = <input id="bd" inputmode="numeric" aria-label="BD의 길이"> cm</div><div class="input-line">∠BOC = <input id="ang" inputmode="numeric" aria-label="각 BOC의 크기"> °</div><button class="primary" id="checkQuiz" type="button">확인하기</button><div class="feedback" id="quizFeedback" aria-live="polite">수직이등분과 같은 길이를 함께 생각해 보세요.</div>`;quiz(['bd','ang'],['4','90'],'맞았습니다! BD = 4 cm, ∠BOC = 90°입니다.');}
if(type==='relations'){list.innerHTML=`<div class="condition-grid"><button class="condition" data-route="trap" type="button">한 쌍의 대변이 평행</button><button class="condition" data-route="para" type="button">다른 한 쌍도 평행</button><button class="condition" data-route="rect" type="button">한 내각이 직각</button><button class="condition" data-route="rhomb" type="button">이웃한 두 변의 길이가 같음</button><button class="condition" data-route="square" type="button">두 조건을 모두 만족</button></div><div class="feedback" id="routeFeedback" aria-live="polite">첫 번째 조건부터 눌러 보세요.</div>`;const order=['trap','para','rect','rhomb','square'],msg={trap:'사각형 → 사다리꼴',para:'사다리꼴 → 평행사변형',rect:'평행사변형 → 직사각형',rhomb:'평행사변형 → 마름모',square:'직사각형이면서 마름모 → 정사각형'};list.addEventListener('click',e=>{const b=e.target.closest('.condition');if(!b)return;list.querySelectorAll('.condition').forEach(x=>x.classList.remove('active'));stage.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));b.classList.add('active');const route=b.dataset.route;const idx=order.indexOf(route);['quad',...order.slice(0,idx+1)].forEach(n=>stage.querySelector(`[data-node="${n}"]`)?.classList.add('active'));document.getElementById('routeFeedback').textContent=msg[route];pulseTargets('.node.active');});}
if(type==='tree')setupTree();}
function quiz(ids,answers,success){document.getElementById('checkQuiz').onclick=()=>{const vals=ids.map(id=>document.getElementById(id).value.trim());const ok=vals.every((v,i)=>v===answers[i]);const f=document.getElementById('quizFeedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?success:'다시 생각해 봅시다. 대각선의 전체 길이와 절반 길이를 구분하세요.';if(ok)pulseTargets('.diagram');};}
function setupTree(){const q=document.getElementById('treeQuestion'),res=document.getElementById('treeResult'),ans=document.getElementById('treeAnswers'),reset=document.getElementById('treeReset');let state='q1';const qs={q1:'한 쌍의 대변이 평행한가요?',q2:'다른 한 쌍의 대변도 평행한가요?',q3:'한 내각이 직각인가요?',q4:'이웃한 두 변의 길이가 같은가요?',q5:'이웃한 두 변의 길이가 같은가요?'};function show(){q.textContent=qs[state]||'';}function finish(name){q.textContent='가장 알맞은 이름은';res.textContent=name+'!';res.classList.add('confetti');ans.classList.add('hidden');reset.classList.remove('hidden');reset.classList.add('shown');}ans.onclick=e=>{const b=e.target.closest('[data-tree]');if(!b)return;const y=b.dataset.tree==='yes';if(state==='q1'){if(!y)return finish('그 외 사각형');state='q2';}else if(state==='q2'){if(!y)return finish('사다리꼴');state='q3';}else if(state==='q3'){state=y?'q4':'q5';}else if(state==='q4'){return finish(y?'정사각형':'직사각형');}else if(state==='q5'){return finish(y?'마름모':'평행사변형');}show();};reset.onclick=()=>{state='q1';res.textContent='';res.classList.remove('confetti');ans.classList.remove('hidden');reset.classList.add('hidden');reset.classList.remove('shown');show();};show();}
prev.onclick=()=>{if(current>0){current--;render();window.scrollTo({top:0,behavior:'smooth'})}};next.onclick=()=>{current=current===slides.length-1?0:current+1;render();window.scrollTo({top:0,behavior:'smooth'})};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click();});render();
</script>
</body>
