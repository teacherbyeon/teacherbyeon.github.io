<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>수업 타이머</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="status"><span class="badge">수업 타이머</span><span id="stateText" class="state-dot">준비</span></div>
    <div class="top-actions">
      <button id="btnFullscreen" class="btn ghost">⛶ 전체화면</button>
      <button id="btnPanel" class="btn ghost" aria-expanded="false" aria-controls="panel">⚙ 세부 설정</button>
    </div>
  </header>
  <main class="stage">
    <section class="timerArea" aria-live="polite">
      <div id="timeText" class="timeText">03:00</div><div id="hintText" class="hint muted"></div>
      <div class="quick-controls" aria-label="타이머 조작">
        <button class="chip" data-add="-10">−10초</button><button id="btnStartPause" class="btn primary main-action">▶ 시작</button><button class="chip" data-add="10">+10초</button><button id="btnReset" class="btn reset">↺ 초기화</button>
      </div>
      <p class="shortcut-hint">Space 시작·일시정지 · ↑↓ 10초 조절 · R 초기화</p>
    </section>
    <section class="presets" aria-label="빠른 시간 설정">
      <span class="presets-label">빠른 설정</span><button class="preset" data-set="60">1분</button><button class="preset" data-set="120">2분</button><button class="preset active" data-set="180">3분</button><button class="preset" data-set="300">5분</button><button class="preset" data-set="600">10분</button>
    </section>
    <section class="promptCard"><div class="promptLabel">수업 안내</div><div id="promptText" class="promptText">문제를 풀어보세요.</div></section>
  </main>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="panel" class="panel" aria-hidden="true">
    <div class="panelHeader"><div><div class="panelTitle">세부 설정</div><div class="muted small">수업 전에 필요한 내용을 설정하세요.</div></div><button id="btnClosePanel" class="btn ghost">✕ 닫기</button></div>
    <div class="panelBody">
      <section class="section first"><div class="sectionTitle">시간 직접 입력</div><div class="time-inputs">
        <label class="field"><span class="fieldLabel">분</span><input id="baseMinutes" type="number" min="0" max="60" value="3" inputmode="numeric" /></label><span class="colon">:</span><label class="field"><span class="fieldLabel">초</span><input id="baseSecondsPart" type="number" min="0" max="59" value="0" inputmode="numeric" /></label><button id="btnApplyBase" class="btn">적용</button>
      </div></section>
      <section class="section"><div class="sectionTitle">수업 안내</div>
        <label class="field"><span class="fieldLabel">지시문</span><textarea id="promptInput" rows="3" placeholder="예: 모둠과 풀이 방법을 이야기하세요."></textarea></label>
        <label class="field"><span class="fieldLabel">힌트 (선택)</span><input id="hintInput" type="text" placeholder="예: 마지막 항부터 정리해보세요." /></label>
        <div class="row"><button id="btnApplyText" class="btn primary">안내 반영</button><button id="btnToggleHint" class="btn ghost">힌트 표시</button></div>
      </section>
      <section class="section"><div class="sectionTitle">알림</div><label class="toggle"><input id="optBeepEnd" type="checkbox" checked /><span>종료 시 알림음</span></label><label class="toggle"><input id="optBeep10" type="checkbox" /><span>10초 전 알림음</span></label></section>
      <p class="foot muted">설정은 이 브라우저에만 저장됩니다.</p>
    </div>
  </aside>
  <script src="app.js"></script>
</body>
</html>
