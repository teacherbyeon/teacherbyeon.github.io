<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>역할 선택 | 수업 벽보드</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-page="role">
  <main class="container role-container">
    <section class="panel role-panel">
      <h1>역할을 선택하세요.</h1>
      <p class="subtitle">교사 또는 학생으로 접속하여 수업 벽보드를 시작합니다.</p>
      <div class="role-hero-illustration" aria-hidden="true">
        <div class="hero-badge">👩‍🏫👨‍🎓 수업 벽보드</div>
      </div>
      <div class="role-actions">
        <button id="pickTeacher" class="role-btn teacher">교사로 시작</button>
        <button id="pickStudent" class="role-btn student">학생으로 시작</button>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
