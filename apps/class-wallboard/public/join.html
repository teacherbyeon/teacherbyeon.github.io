<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업 입장 | 수업 벽보드</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-page="join">
  <main class="container">
    <section class="panel">
      <h1>수업 입장</h1>
      <p class="subtitle">교사는 새 수업 코드를 만들고, 학생은 안내받은 수업 이름/코드로 접속하세요.</p>
      <div class="join-layout">
        <div class="join-main">
          <p id="roleText"></p>
          <p id="joinStatus" class="hint"></p>
          <p id="joinUrlInfo" class="hint"></p>
          <div id="studentClassListRow" class="row hidden">
            <strong>수업 목록에서 선택하세요</strong>
            <div id="studentClassList" class="history-tabs"></div>
          </div>
          <div class="row">
            <strong>선택된 수업: <span id="selectedClassName">-</span></strong>
          </div>
          <div class="row">
            <label>수업 코드 <input id="classCode" maxlength="6" inputmode="numeric" placeholder="예: 123456" /></label>
            <button id="joinBtn">입장</button>
          </div>
          <div id="teacherOnly" class="hidden">
            <div class="row">
              <label>수업 이름
                <input id="classNameInput" placeholder="예: 260321 2학년 3반" />
              </label>
            </div>
            <div class="row">
              <button id="makeClassBtn">교사용 코드 생성</button>
              <button id="pastClassesBtn" class="secondary">과거 수업 관리</button>
              <span id="generatedCode"></span>
            </div>
            <div class="row">
              <canvas id="qrCanvas" width="180" height="180"></canvas>
            </div>
          </div>
        </div>
        <aside class="join-side-card">
          <div class="hero-badge">🏫 안내</div>
          <p class="hint">교사는 코드 생성 후 학생에게 수업 이름 + 접속 코드를 안내하세요.</p>
          <p class="hint">학생은 입력 후 바로 입장할 수 있습니다.</p>
        </aside>
      </div>
      <a class="link" href="./role.html">← 역할 다시 선택</a>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
