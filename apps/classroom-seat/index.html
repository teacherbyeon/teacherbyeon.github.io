<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>자리배치 프로그램(오프라인 배포용)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>교실 자리배치 프로그램 (오프라인 배포용)</h1>
    <div id="modeBadge">현재 모드: 선택 모드</div>
    <div id="unsavedMark">저장됨</div>
  </header>

  <main class="layout">
    <section class="boardWrap" id="boardWrap">
      <div class="board" id="board">
        <div class="desk" id="desk">교탁</div>
        <div id="seatLayer"></div>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <h3>모드 선택</h3>
        <div class="modeGrid">
          <button data-mode="select" class="active">선택 모드</button>
          <button data-mode="add">좌석 추가 모드</button>
          <button data-mode="delete">좌석 삭제 모드</button>
          <button data-mode="disable">좌석 사용불가(X) 모드</button>
          <button data-mode="assign">학생 배정 모드</button>
          <button data-mode="swap">자리 바꾸기 모드</button>
        </div>
      </div>

      <div class="card">
        <h3>파일 / 작업</h3>
        <div class="grid2">
          <input id="studentFile" type="file" accept=".xlsx,.csv" />
          <button id="btnLoadPlan">배치 불러오기(JSON)</button>
          <input id="planFile" type="file" accept=".json" hidden />
          <button id="btnSavePlan">배치 저장(JSON)</button>
          <button id="btnBuild" class="primary">자리 다시 생성</button>
          <button id="btnAddSeat">좌석 추가 모드 켜기</button>
          <button id="btnRandom">랜덤 배정</button>
          <button id="btnSmart">조건 반영 자동 배정</button>
          <button id="btnExam">번호순 배치(시험대형)</button>
          <button id="btnPrint">인쇄하기(A4)</button>
          <button id="btnClear" class="danger">배정 전체 초기화</button>
        </div>
      </div>

      <div class="card">
        <h3>기본 설정</h3>
        <div class="row"><label>행</label><input id="rows" type="number" min="1" value="4"><label>열</label><input id="cols" type="number" min="1" value="6"></div>
        <div class="row"><label>보드 확대</label><input id="zoom" type="range" min="0.6" max="1.6" step="0.1" value="1"><span id="zoomLabel">100%</span></div>
        <div class="row"><label>배정 클릭 동작</label><select id="assignBehavior"><option value="swap">자리 교환</option><option value="move">밀어내기 이동</option></select></div>
        <div class="row"><label>자동배정 시도</label><input id="smartTry" type="number" min="20" max="2000" value="200"></div>
      </div>

      <div class="card">
        <h3>출력 문구</h3>
        <div class="row"><label>제목</label><input id="printTitle" type="text" value="2026학년도 1학년 3반 자리 배치표"></div>
        <div class="row"><label>문구1</label><input id="printFooter" type="text" value="교과 선생님 항상 감사드립니다!"></div>
        <div class="row"><label>문구2</label><input id="printFooterSub1" type="text" value="수업시간에 행복한 배움이 이어지길 바랍니다."></div>
        <div class="row"><label>문구3</label><input id="printFooterSub2" type="text" value="급훈 : 예의, 신뢰, 존중"></div>
      </div>

      <div class="card">
        <h3>학생 목록</h3>
        <div class="row"><input id="studentSearch" type="search" placeholder="번호/이름 검색"></div>
        <div id="stats" class="muted"></div>
        <div id="studentList" class="studentList"></div>
      </div>

      <div class="card">
        <h3>선택 좌석 편집</h3>
        <div id="seatEmpty" class="muted">좌석을 선택하세요.</div>
        <div id="seatEditor" style="display:none">
          <div>좌석 ID: <b id="seatId"></b></div>
          <div class="row"><label>라벨</label><input id="seatLabel" type="text"></div>
          <div class="row"><label>구역</label><input id="seatZone" type="text" placeholder="front/back/left/right/teacher-near"></div>
          <div class="row"><label>사용 가능</label><input id="seatEnabled" type="checkbox" checked></div>
          <div class="row"><label>가로</label><input id="seatWidth" type="number" min="40"><label>세로</label><input id="seatHeight" type="number" min="40"></div>
        </div>
      </div>

      <div class="card">
        <h3>조건 반영 자동 배정 결과</h3>
        <div id="report" class="muted">자동 배정 후 요약이 표시됩니다.</div>
      </div>

      <div class="card">
        <h3>상태 메시지</h3>
        <pre id="status">준비 완료</pre>
      </div>
    </aside>
  </main>

  <script src="./xlsx.full.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
