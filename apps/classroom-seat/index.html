<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>담임 실전형 자리배치</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>담임 실전형 자리배치 프로그램</h1>
    <div id="unsavedMark" class="unsaved">저장됨</div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="board-wrap" id="board">
        <div class="board-inner" id="boardInner">
          <div class="desk" id="desk">교탁</div>
          <div id="seatLayer"></div>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <h3>모드</h3>
        <div class="mode-grid">
          <button data-mode="select">선택 모드</button>
          <button data-mode="add-seat">좌석 추가 모드</button>
          <button data-mode="delete-seat">좌석 삭제 모드</button>
          <button data-mode="disable-seat">좌석 비활성화 모드</button>
          <button data-mode="assign">학생 배정 모드</button>
          <button data-mode="swap">SWAP 모드</button>
        </div>
      </div>

      <div class="card">
        <h3>빠른 작업</h3>
        <div class="grid2">
          <input id="studentFile" type="file" accept=".xlsx,.csv" />
          <button id="btnLoad">JSON 불러오기</button>
          <input id="loadJson" type="file" accept=".json" hidden />
          <button id="btnSave">JSON 저장</button>
          <button id="btnGenGrid">자리 다시 생성</button>
          <button id="btnAddSeat">좌석 추가 모드 켜기</button>
          <button id="btnRandom">랜덤 배정</button>
          <button id="btnSmart">스마트 배정</button>
          <button id="btnExam">번호순 배치(시험대형)</button>
          <button id="btnPrint">A4 출력</button>
          <button id="btnClearAssign" class="danger">배정 전체 초기화</button>
        </div>
      </div>

      <div class="card">
        <h3>설정</h3>
        <div class="form-row"><label>행/열</label><input id="rows" type="number" value="4" min="1"><input id="cols" type="number" value="6" min="1"></div>
        <div class="form-row"><label>스냅 ON</label><input id="snapOn" type="checkbox" checked><label>간격</label><input id="snapGrid" type="number" value="16" min="4"></div>
        <div class="form-row"><label>보드 확대</label><input id="zoom" type="range" min="0.6" max="1.6" step="0.1" value="1"><span id="zoomLabel">100%</span></div>
        <div class="form-row"><label>배정 클릭동작</label><select id="swapBehavior"><option value="swap">자리 바꾸기</option><option value="move">밀어내기</option></select></div>
        <div class="form-row"><label>스마트 시도횟수</label><input id="smartTries" type="number" value="200" min="20" max="2000"></div>
      </div>

      <div class="card">
        <h3>출력 문구</h3>
        <input id="printTitle" type="text" value="2026학년도 1학년 3반 4월 자리 배치표" />
        <input id="printFooter" type="text" value="교과 선생님 항상 감사드립니다!" />
        <input id="printFooterSub1" type="text" value="수업시간에 행복한 배움이 이어지길 바랍니다." />
        <input id="printFooterSub2" type="text" value="급훈 : 예의, 신뢰, 존중" />
      </div>

      <div class="card">
        <h3>학생 목록 검색</h3>
        <input id="studentSearch" type="search" placeholder="번호/이름 검색">
        <div id="stats" class="muted"></div>
        <div id="studentList" class="student-list"></div>
      </div>

      <div class="card">
        <h3>선택 좌석 속성</h3>
        <div id="noSeatSelected" class="muted">좌석을 선택하세요.</div>
        <div id="seatForm" class="seat-form">
          <div>ID: <b id="seatId"></b></div>
          <label>라벨 <input id="seatLabel" type="text"></label>
          <label>구역(zone) <input id="seatZone" type="text" placeholder="front/back/teacher-near"></label>
          <label><input id="seatEnabled" type="checkbox" checked> 사용 가능</label>
          <label>가로 <input id="seatWidth" type="number" min="40"></label>
          <label>세로 <input id="seatHeight" type="number" min="40"></label>
        </div>
      </div>

      <div class="card">
        <h3>스마트 배정 결과</h3>
        <div id="report"></div>
      </div>

      <div class="card">
        <h3>상태 메시지</h3>
        <pre id="status" class="status"></pre>
      </div>
    </aside>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
