<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff6b35">
  <meta name="description" content="학년과 단원별 수학 게임을 모아 보는 BBB쌤 수학 게임관">
  <title>수학 게임 | BBB쌤의 수학 실험실</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Montserrat:wght@700;800;900&display=swap');
    :root{--ink:#121826;--paper:#f6f4ed;--lime:#d7ff45;--orange:#ff6b35;--blue:#3158ff;--muted:#687083;--white:#fff;--shadow:6px 6px 0 var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}.shell{width:min(1180px,calc(100% - 32px));margin:auto}
    .nav{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink)}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.brandmark{width:34px;height:34px;border:2px solid var(--ink);background:var(--lime);display:grid;place-items:center;border-radius:50%;font-family:Montserrat}.home{border:2px solid var(--ink);background:#fff;padding:9px 15px;border-radius:999px;font-weight:800}.home:hover{background:var(--lime)}
    .hero{padding:70px 0 42px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}.kicker{color:var(--orange);font-weight:900;letter-spacing:.08em}.hero h1{font-family:Montserrat,"Gowun Dodum";font-size:clamp(2.8rem,6vw,5.4rem);line-height:.95;letter-spacing:-.06em;margin:17px 0}.hero p{color:var(--muted);font-size:1.08rem;line-height:1.7;max-width:650px}.symbol{width:160px;height:160px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font:900 4.2rem Montserrat;box-shadow:10px 10px 0 var(--lime);transform:rotate(3deg)}
    .finder{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:20px;margin-bottom:24px}.finder-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.group:before{content:attr(data-label);font-size:.78rem;font-weight:900;color:var(--muted);margin-right:2px}.filter{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}.filter.active,.filter:hover{background:var(--lime)}.search{margin-left:auto;min-width:280px;display:flex;border:2px solid var(--ink);border-radius:999px;padding:4px 6px 4px 16px}.search input{width:100%;border:0;outline:0;background:transparent;padding:8px}.search button{width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 18px}.summary h2{margin:0;font-family:Montserrat,"Gowun Dodum";font-size:1.8rem}.count{font-weight:800;color:var(--orange)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:80px}.game{position:relative;min-height:225px;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:21px;display:flex;flex-direction:column;transition:.18s}.game:hover{transform:translate(-4px,-4px);box-shadow:var(--shadow)}.meta{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:.75rem;font-weight:800;border:1px solid var(--ink);border-radius:999px;padding:4px 8px}.game h3{font-size:1.35rem;margin:19px 0 8px}.game p{color:var(--muted);line-height:1.6;margin:0 0 22px}.open{margin-top:auto;align-self:flex-end;width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:1.2rem}.empty{grid-column:1/-1;border:2px dashed var(--ink);background:#fff;padding:65px 24px;text-align:center;border-radius:10px}footer{border-top:2px solid var(--ink);padding:28px 0 40px;color:var(--muted)}
    @media(max-width:850px){.hero{grid-template-columns:1fr}.symbol{display:none}.grid{grid-template-columns:repeat(2,1fr)}.search{width:100%;margin-left:0}.finder-row{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{width:calc(100% - 22px)}.brand span:last-child{font-size:.9rem}.home{padding:8px 11px}.hero{padding-top:45px}.grid{grid-template-columns:1fr}.game{min-height:200px}.finder{padding:14px}}
  </style>
</head>
<body>
  <header class="shell nav"><a class="brand" href="../../"><span class="brandmark">B³</span><span>BBB쌤의 수학 실험실</span></a><a class="home" href="../../">홈으로</a></header>
  <main class="shell">
    <section class="hero"><div><span class="kicker">MATH GAMES</span><h1>수학<br>게임관</h1><p>게임으로 수학 개념을 연습하고 감각을 키워보세요. 학교급과 학년을 선택해 수업에 맞는 게임을 찾을 수 있습니다.</p></div><div class="symbol" aria-hidden="true">▶</div></section>
    <section class="finder" aria-label="게임 찾기"><div class="finder-row"><div class="group" id="schoolFilters" data-label="학교급"></div><div class="group" id="gradeFilters" data-label="학년"></div><label class="search"><input id="search" type="search" placeholder="게임명, 단원 또는 개념 검색" aria-label="게임 검색"><button id="clear" aria-label="검색 지우기">×</button></label></div></section>
    <div class="summary"><h2 id="resultTitle">전체 게임</h2><span class="count" id="count">0개</span></div><section class="grid" id="gameGrid" aria-live="polite"></section>
  </main>
  <footer><div class="shell">BBB쌤의 수학 게임관 · 수학 게임은 계속 추가됩니다.</div></footer>
  <script>
    let games=[],school='전체',grade='전체';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function loadGames(){try{const r=await fetch('./games.json',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();games=(Array.isArray(d)?d.filter(x=>x&&x.published!==false):[]).sort((a,b)=>['schoolOrder','gradeOrder','areaOrder','unitOrder','gameOrder'].reduce((v,k)=>v||(Number(a[k]??999)-Number(b[k]??999)),0)||String(a.title||'').localeCompare(String(b.title||''),'ko'))}catch{games=[]}renderFilters();render()}
    function button(label,type,on){return `<button class="filter ${on?'active':''}" data-${type}="${esc(label)}" aria-pressed="${on}">${esc(label)}</button>`}function renderFilters(){const s=['전체',...new Set(games.map(x=>x.school).filter(Boolean))];$('#schoolFilters').innerHTML=s.map(x=>button(x,'school',x===school)).join('');const g=['전체',...new Set(games.filter(x=>school==='전체'||x.school===school).map(x=>x.grade).filter(Boolean))];if(!g.includes(grade))grade='전체';$('#gradeFilters').innerHTML=g.map(x=>button(x,'grade',x===grade)).join('')}
    function render(){const q=$('#search').value.trim().toLowerCase();const list=games.filter(x=>(school==='전체'||x.school===school)&&(grade==='전체'||x.grade===grade)&&[x.title,x.area,x.unit,x.description,...(x.tags||[])].join(' ').toLowerCase().includes(q));$('#resultTitle').textContent=[school,grade].filter(x=>x!=='전체').join(' · ')||'전체 게임';$('#count').textContent=`${list.length}개`;$('#gameGrid').innerHTML=list.length?list.map(x=>`<article class="game"><div class="meta"><span class="badge">${esc(x.school)}</span><span class="badge">${esc(x.grade)}</span><span class="badge">${esc(x.unit)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.description||'게임으로 수학 개념을 익혀보세요.')}</p><a class="open" href="${esc(x.href)}" aria-label="${esc(x.title)} 열기">→</a></article>`).join(''):'<div class="empty"><b>조건에 맞는 게임이 없습니다.</b></div>'}
    $('#schoolFilters').onclick=e=>{if(!e.target.dataset.school)return;school=e.target.dataset.school;grade='전체';renderFilters();render()};$('#gradeFilters').onclick=e=>{if(!e.target.dataset.grade)return;grade=e.target.dataset.grade;renderFilters();render()};$('#search').oninput=render;$('#clear').onclick=()=>{$('#search').value='';$('#search').focus();render()};loadGames();
  </script>
</body>
</html>
